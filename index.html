<title>MERLIO — Singapore Pixel Adventure</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060f;
    overflow: hidden;
    font-family: monospace;
    touch-action: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #wrap {
    position: relative;
    line-height: 0;
    box-shadow: 0 0 60px rgba(120, 80, 255, .25), 0 0 12px rgba(0,0,0,.8);
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    width: min(960px, 100vw);
    height: auto;
    max-height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #0e1440;
  }
  /* subtle CRT scanlines */
  #wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.12) 3px
    );
    mix-blend-mode: multiply;
  }
  .tbtn {
    position: fixed;
    bottom: 4vh;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.35);
    color: #fff;
    font-size: 26px;
    font-family: monospace;
    display: none;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    z-index: 10;
  }
  .tbtn:active { background: rgba(255,255,255,.25); }
  #btnL { left: 4vw; }
  #btnR { left: calc(4vw + 80px); }
  #btnJ { right: 4vw; width: 76px; height: 76px; }
  @media (pointer: coarse) { .tbtn { display: flex; } }
</style>
</head>

/* ---------------- sprite baking ---------------- */
function bake(rows, pal) {
  const w = Math.max(...rows.map(r => r.length));
  const h = rows.length;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === "." || ch === " ") continue;
      g.fillStyle = pal[ch] || "#f0f";
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

/* ---------------- audio ---------------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type = "square", vol = 0.12, slide = 0, delay = 0) {
  const ac = audio(); if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(gn).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function key(x, y) { return x + "," + y; }

/* level-building helpers (operate on the module-level grid) */
function ground(x1, x2) { for (let x = x1; x <= x2; x++) { grid[13][x] = 1; grid[14][x] = 1; } }
function block(x, y, t) { grid[y][x] = t; }
function q(x, y, what) { grid[y][x] = 3; qContents[key(x, y)] = what; }
function coins(list) { list.forEach(([x, y]) => coinSpawns.push({ x: x * TILE + 2, y: y * TILE + 2 })); }
function foe(kind, x) { enemySpawns.push({ kind, x: x * TILE, y: 12 * TILE }); }
const durian = x => foe("durian", x);
const pigeon = x => foe("pigeon", x);
const tissue = x => foe("tissue", x);
const coconut = x => foe("coconut", x);
function stairsUp(x0, h) { for (let i = 0; i < h; i++) for (let j = 0; j <= i; j++) grid[12 - j][x0 + i] = 1; }
function stairsDn(x0, h) { for (let i = 0; i < h; i++) for (let j = 0; j <= h - 1 - i; j++) grid[12 - j][x0 + i] = 1; }
function deco(d) { decorations.push(d); }
function pole(x) { for (let y = 4; y <= 12; y++) grid[y][x] = 5; }
function sign(x, text) { deco({ type: "sign", x: x * TILE, y: 13 * TILE - 20, text }); }
/* obstacle helpers */
function spike(x) { grid[13][x] = 6; }
function bounceTile(x, y) { grid[y][x] = 7; }
function wet(x1, x2) { for (let x = x1; x <= x2; x++) grid[13][x] = 8; }
function jet(x, kind) { jetSpawns.push({ x: x * TILE, kind }); }
function plat(p) { platSpawns.push(p); }
function updraft(x1, x2) { updrafts.push({ x1: x1 * TILE, x2: (x2 + 1) * TILE, top: 6 * TILE }); }
function erp(x) { erps.push({ x: x * TILE, cd: 0, flash: 0 }); }

function loadLevel(i) {
  levelIndex = i;
  grid = Array.from({ length: ROWS }, () => new Array(MAX_LEVEL_W).fill(0));
  qContents = {}; bumpMap = {};
  enemySpawns = []; coinSpawns = []; decorations = [];
  jetSpawns = []; platSpawns = []; updrafts = []; erps = [];
  cur().build();
  jets = jetSpawns.map((s, k) => ({ ...JET_DEF[s.kind], kind: s.kind, x: s.x, baseY: 13 * TILE, off: k * 1.13 }));
  spawnWorld();
  resetPlayer();
  timeLeft = cur().time;
  camX = 0; winTimer = 0; shake = 0;
  player.inv = 1.2;
}

function solidAt(tx, ty) {
  if (tx < 0 || tx >= levelW) return true;
  if (ty < 0) return false;
  if (ty >= ROWS) return false;
  const t = grid[ty][tx];
  return t === 1 || t === 2 || t === 3 || t === 4 || t === 7 || t === 8;
}

  state = "intro"; introTimer = 0;
}

}
function handleConfirm() {
  audio();
  if (state === "title" || state === "gameover" || state === "won") newGame();
  else if (state === "levelDone") startLevel(levelIndex + 1);
  else if (state === "intro") introTimer = 99;

/* ---------------- input ---------------- */
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === " ") keys["space"] = true;
  if (e.key.toLowerCase() === "m" && !e.repeat) muted = !muted;
  const canConfirm = !["play", "dying", "winAnim"].includes(state);
  if ((e.key === "Enter" || e.key === " ") && canConfirm) {
    handleConfirm();
  } else if (state === "play" && (e.key === " " || e.key === "ArrowUp" || e.key.toLowerCase() === "w") && !e.repeat) {
    player.jbuf = 0.12;
  }
  audio();
});
addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key === " ") keys["space"] = false;
});
function bindBtn(id, k) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); keys[k] = true; audio();
                     if (k === "space" && state === "play") player.jbuf = 0.12;
                     else if (k === "space") handleConfirm(); };
  const off = e => { e.preventDefault(); keys[k] = false; };
  el.addEventListener("touchstart", on); el.addEventListener("touchend", off);
  el.addEventListener("mousedown", on);  el.addEventListener("mouseup", off);
}
bindBtn("btnL", "arrowleft"); bindBtn("btnR", "arrowright"); bindBtn("btnJ", "space");

const left  = () => keys["arrowleft"] || keys["a"];
const right = () => keys["arrowright"] || keys["d"];
const jumpK = () => keys["space"] || keys["arrowup"] || keys["w"];

/* ---------------- helpers ---------------- */
function popup(x, y, txt, color = "#fff") { popups.push({ x, y, txt, t: 1, color }); }
function burst(x, y, color, n = 8, spd = 70) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0.6 + Math.random() * 0.3, color });
  }
}
function addScore(n, x, y) { score += n; if (x !== undefined) popup(x, y, "+" + n); }

/* ---------------- tile bump ---------------- */
function bumpTile(tx, ty) {
  const t = grid[ty][tx];
  const k = key(tx, ty);
  if (t === 3) {
    const what = qContents[k] || "coin";
    grid[ty][tx] = 4;
    bumpMap[k] = 0.25;
    if (what === "coin") {
      coinCount++; addScore(200);
      popup(tx * TILE + 2, ty * TILE - 10, "+200", "#ffd23f");
      burst(tx * TILE + 8, ty * TILE - 4, "#ffd23f", 6, 50);
      sfx.coin();
    } else {
      items.push({ type: "crab", x: tx * TILE, y: ty * TILE - 4, vx: 0, vy: -60, rise: 0.4 });
      sfx.power();
    }
  } else if (t === 2) {
    bumpMap[k] = 0.25;
    sfx.bump();
  }
}

/* ---------------- physics ---------------- */
function moveAndCollide(e, hitBlocks) {
  e.onGround = false;
  // horizontal
  e.x += e.vx * DT;
  let x0 = Math.floor(e.x / TILE), x1 = Math.floor((e.x + e.w - 1) / TILE);
  let y0 = Math.floor(e.y / TILE), y1 = Math.floor((e.y + e.h - 1) / TILE);
  if (e.vx > 0) {
    for (let ty = y0; ty <= y1; ty++) if (solidAt(x1, ty)) { e.x = x1 * TILE - e.w; e.vx = hitBlocks ? 0 : -e.vx; e.hitWall = true; break; }
  } else if (e.vx < 0) {
    for (let ty = y0; ty <= y1; ty++) if (solidAt(x0, ty)) { e.x = (x0 + 1) * TILE; e.vx = hitBlocks ? 0 : -e.vx; e.hitWall = true; break; }
  }
  // vertical
  e.y += e.vy * DT;
  x0 = Math.floor(e.x / TILE); x1 = Math.floor((e.x + e.w - 1) / TILE);
  y0 = Math.floor(e.y / TILE); y1 = Math.floor((e.y + e.h - 1) / TILE);
  if (e.vy > 0) {
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, y1)) {
      e.y = y1 * TILE - e.h;
      if (hitBlocks && grid[y1][tx] === 7) {
        // trampoline / bounce net: boing!
        e.vy = -640; e.onGround = false; e.bounced = 0.5;
        bumpMap[key(tx, y1)] = 0.25;
        burst(e.x + e.w / 2, y1 * TILE, "#ff8ae2", 6, 55);
        sfx.boing();
      } else {
        e.vy = 0; e.onGround = true;
      }
      break;
    }
  } else if (e.vy < 0) {
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, y0)) {
      e.y = (y0 + 1) * TILE; e.vy = 0;
      if (hitBlocks) {
        // bump the block most overlapped by the head
        let best = tx, bestOv = -1;
        for (let t2 = x0; t2 <= x1; t2++) if (solidAt(t2, y0)) {
          const ov = Math.min(e.x + e.w, (t2 + 1) * TILE) - Math.max(e.x, t2 * TILE);
          if (ov > bestOv) { bestOv = ov; best = t2; }
        }
        bumpTile(best, y0);
      }
      break;
    }
  }
}

const GRAV = 1500, MOVE = 900, MAXVX = 118, RUNVX = 150, FRICTION = 800, JUMPV = 445;
let DT = 1 / 60;

function updatePlayer(dt) {
  const p = player;
  // wet floor (MRT): slippery!
  const wtx = Math.floor((p.x + p.w / 2) / TILE), wty = Math.floor((p.y + p.h + 2) / TILE);
  const onWet = wty >= 0 && wty < ROWS && grid[wty][wtx] === 8;
  const grip = onWet ? 0.35 : 1, fricMul = onWet ? 0.1 : 1;
  const accel = (left() ? -1 : 0) + (right() ? 1 : 0);
  const maxv = p.power > 0 ? RUNVX : MAXVX;
  if (accel !== 0) {
    p.vx += accel * MOVE * grip * dt;
    p.dir = accel;
    p.anim += Math.abs(p.vx) * dt * 0.15;
  } else {
    const f = FRICTION * fricMul * dt;
    if (Math.abs(p.vx) <= f) p.vx = 0; else p.vx -= Math.sign(p.vx) * f;
  }
  p.vx = Math.max(-maxv, Math.min(maxv, p.vx));

  p.coyote = p.onGround ? 0.08 : Math.max(0, p.coyote - dt);
  p.jbuf = Math.max(0, p.jbuf - dt);
  if (p.jbuf > 0 && p.coyote > 0) {
    p.vy = -JUMPV; p.coyote = 0; p.jbuf = 0; sfx.jump();
  }
  p.bounced = Math.max(0, (p.bounced || 0) - dt);
  if (!jumpK() && p.vy < -140 && p.bounced <= 0) p.vy = -140; // variable jump height (trampolines exempt)

  p.vy = Math.min(p.vy + GRAV * dt, 420);

  // Jewel vortex updrafts float you upward
  const pcx = p.x + p.w / 2;
  for (const u of updrafts) {
    if (pcx > u.x1 && pcx < u.x2 && p.y + p.h > u.top && p.y < 13 * TILE) {
      p.vy = Math.max(p.vy - 2100 * dt, -240);
      if (Math.random() < 0.4) particles.push({
        x: p.x + Math.random() * p.w, y: p.y + p.h,
        vx: (Math.random() - 0.5) * 20, vy: -80, t: 0.5, color: "#9fe8ff",
      });
    }
  }

  moveAndCollide(p, true);
  p.x = Math.max(0, Math.min(p.x, levelW * TILE - p.w));

  // ride moving platforms (bumboat, trolley, cable car, canopy lift)
  for (const pl of plats) {
    const withinX = p.x + p.w > pl.x + 1 && p.x < pl.x + pl.w - 1;
    if (p.vy >= 0 && withinX && p.y + p.h >= pl.y && p.y + p.h <= pl.y + 10) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true;
      p.x += pl.dx; p.y += pl.dy;
    }
  }

  // spike tiles (durian husks, satay skewers, sea urchins)
  const stx = Math.floor(pcx / TILE), sty = Math.floor((p.y + p.h - 3) / TILE);
  if (sty >= 0 && sty < ROWS && grid[sty][stx] === 6) hurtPlayer();

  if (p.inv > 0) p.inv -= dt;
  if (p.power > 0) {
    p.power -= dt;
    if (Math.random() < 0.35) particles.push({
      x: p.x + Math.random() * p.w, y: p.y + Math.random() * p.h,
      vx: (Math.random() - 0.5) * 30, vy: -50, t: 0.4,
      color: ["#ff5252","#ffd23f","#5ce1e6","#7cf25c"][Math.floor(Math.random() * 4)],
    });
  }

  // fell into the bay
  if (p.y > ROWS * TILE + 24) killPlayer(true);

  // reached the flag
  if (p.x + p.w / 2 >= flagX * TILE + 6 && state === "play") {
    state = "winAnim"; winTimer = 0;
    addScore(Math.floor(timeLeft) * 10);
    sfx.win();
  }
}

const DEATH_CRIES = ["AIYO!", "WAH LAU!", "ALAMAK!", "OH NO LAH!", "KENA!"];
const STOMP_CRIES = ["PAK!", "SISU!", "SORRY AH!", "TAKE THAT!"];
function killPlayer(fell) {
  if (state !== "play") return;
  state = "dying"; deadTimer = 0;
  player.vy = fell ? 0 : -380;
  player.vx = 0;
  shake = 0.3;
  popup(player.x - 10, player.y - 12, DEATH_CRIES[Math.floor(Math.random() * DEATH_CRIES.length)], "#ff8896");
  sfx.die();
}
function hurtPlayer() {
  if (player.inv > 0 || player.power > 0) return;
  killPlayer(false);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!e.active) {
      if (e.x < camX + VW + 48 && e.x > camX - 48) e.active = true;
      else continue;
    }
    if (e.squash > 0) { e.squash -= dt; if (e.squash <= 0) e.alive = false; continue; }
    if (e.flung) {
      e.vy += GRAV * dt; e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.y > ROWS * TILE + 40) e.alive = false;
      continue;
    }
    e.anim += dt * 6;
    e.hitWall = false;
    e.vy = Math.min(e.vy + GRAV * dt, 420);
    moveAndCollide(e, false);
    // turn at ledges (coconuts just roll off, it's the Sentosa way)
    if (e.onGround && e.kind !== "coconut") {
      const ahead = e.vx > 0 ? Math.floor((e.x + e.w + 1) / TILE) : Math.floor((e.x - 1) / TILE);
      const below = Math.floor((e.y + e.h + 2) / TILE);
      if (!solidAt(ahead, below)) e.vx = -e.vx;
    }
    // pigeons hop around like they own the void deck
    if (e.kind === "pigeon" && e.onGround && Math.random() < dt * 1.1) e.vy = -150;
    if (e.x > camX - 40 && state === "play") {
      // vs player
      const p = player;
      if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
        if (p.power > 0) {
          e.flung = true; e.vx = 120 * Math.sign(e.x - p.x + 0.1); e.vy = -260;
          addScore(200, e.x, e.y - 8); burst(e.x + 8, e.y + 8, "#8fbc3f"); sfx.stomp();
          popup(e.x, e.y - 16, "KENA!", "#ffd23f");
        } else if (p.vy > 60 && p.y + p.h - e.y < 11) {
          e.squash = 0.45;
          p.vy = -260; p.jbuf = 0;
          addScore(100, e.x, e.y - 8); burst(e.x + 8, e.y + 10, "#8fbc3f", 6, 50); sfx.stomp();
          popup(e.x, e.y - 16, STOMP_CRIES[Math.floor(Math.random() * STOMP_CRIES.length)], "#9fe8ff");
        } else {
          hurtPlayer();
        }
      }
    }
  }
}

function updateItems(dt) {
  for (const it of items) {
    if (it.dead) continue;
    if (it.rise > 0) { it.rise -= dt; it.y += it.vy * dt; if (it.rise <= 0) { it.vx = 40; it.vy = 0; } continue; }
    it.vy = Math.min(it.vy + GRAV * dt, 420);
    it.w = 13; it.h = 10;
    moveAndCollide(it, false);
    const p = player;
    if (p.x < it.x + 13 && p.x + p.w > it.x && p.y < it.y + 10 && p.y + p.h > it.y) {
      it.dead = true;
      p.power = 8; p.inv = Math.max(p.inv, 0.5);
      addScore(1000, it.x, it.y - 8);
      popup(p.x - 14, p.y - 18, "CHILLI POWER!", "#ff5252");
      burst(it.x + 8, it.y + 5, "#e8442c", 12, 90);
      sfx.power();
    }
    if (it.y > ROWS * TILE + 40) it.dead = true;
  }
}

function updateCoins(dt) {
  const p = player;
  for (const c of coinsE) {
    if (c.taken) continue;
    if (p.x < c.x + 12 && p.x + p.w > c.x && p.y < c.y + 12 && p.y + p.h > c.y) {
      c.taken = true; coinCount++; addScore(100);
      popup(c.x - 2, c.y - 8, "+100", "#ffd23f");
      burst(c.x + 6, c.y + 6, "#ffd23f", 5, 45);
      sfx.coin();
    }
  }
}

/* ---------------- obstacle entities ---------------- */
function jetPhase(j) {
  const t = (tGlobal + j.off) % j.period;
  return t < j.warn ? "warn" : (t < j.warn + j.on ? "on" : "idle");
}
function updateJets(dt) {
  for (const j of jets) {
    if (jetPhase(j) !== "on") continue;
    const p = player;
    if (p.x + p.w > j.x + 3 && p.x < j.x + 13 &&
        p.y + p.h > j.baseY - j.h + 4 && p.y < j.baseY) hurtPlayer();
  }
}

function updatePlats(dt) {
  for (const pl of plats) {
    pl.dx = 0; pl.dy = 0;
    if (pl.vert) {
      pl.y += pl.v * pl.dir * dt; pl.dy = pl.v * pl.dir * dt;
      if (pl.y < pl.y1) { pl.y = pl.y1; pl.dir = 1; }
      if (pl.y > pl.y2) { pl.y = pl.y2; pl.dir = -1; }
    } else {
      pl.x += pl.v * pl.dir * dt; pl.dx = pl.v * pl.dir * dt;
      if (pl.x < pl.x1) { pl.x = pl.x1; pl.dir = 1; }
      if (pl.x > pl.x2) { pl.x = pl.x2; pl.dir = -1; }
    }
  }
}

/* coconuts drop from palms when MERLIO walks underneath */
function updateFalls(dt) {
  for (const d of decorations) {
    if (d.type !== "palm") continue;
    d.cd = Math.max(0, (d.cd || 0) - dt);
    if (d.cd <= 0 && Math.abs(player.x - d.x) < 56) {
      falls.push({ x: d.x + 6, y: 13 * TILE - 24, vy: 0 });
      d.cd = 2.6;
    }
  }
  const p = player;
  for (const f of falls) {
    f.vy = Math.min(f.vy + GRAV * dt, 380);
    f.y += f.vy * dt;
    const tx = Math.floor(f.x / TILE), ty = Math.floor((f.y + 8) / TILE);
    if (solidAt(tx, ty) || f.y > ROWS * TILE + 20) {
      f.dead = true; burst(f.x - 2, f.y + 6, "#8a5a2c", 6, 55); sfx.bump();
    } else if (p.inv <= 0 && Math.abs(f.x - (p.x + p.w / 2)) < 10 &&
               f.y + 6 > p.y && f.y - 6 < p.y + p.h) {
      f.dead = true; hurtPlayer();
    }
  }
  falls = falls.filter(f => !f.dead);
}

/* ERP gantry: passing under costs you one coin. Singapore is a fine city. */
function updateErps(dt) {
  for (const e of erps) {
    e.cd = Math.max(0, e.cd - dt);
    e.flash = Math.max(0, e.flash - dt);
    if (e.cd > 0) continue;
    const pcx = player.x + player.w / 2;
    if (Math.abs(pcx - e.x) < 9) {
      e.cd = 3; e.flash = 0.6; sfx.erp();
      if (coinCount > 0) {
        coinCount--;
        popup(e.x - 14, 13 * TILE - 48, "ERP -$1", "#ffd23f");
      } else {
        popup(e.x - 22, 13 * TILE - 48, "NO COINS LAH!", "#ff8896");
      }
    }
  }
}

function updateFx(dt) {
  for (const pa of particles) { pa.t -= dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += 500 * dt; }
  particles = particles.filter(pa => pa.t > 0);
  for (const po of popups) { po.t -= dt; po.y -= 24 * dt; }
  popups = popups.filter(po => po.t > 0);
  for (const k in bumpMap) { bumpMap[k] -= dt; if (bumpMap[k] <= 0) delete bumpMap[k]; }
  if (shake > 0) shake -= dt;
}

/* ---------------- background ---------------- */

}));
const clouds = Array.from({ length: 7 }, (_, i) => ({
  x: i * 340 + Math.random() * 200, y: 24 + Math.random() * 55,
  w: 34 + Math.random() * 30, spd: 3 + Math.random() * 4,
}));
const cityBuildings = [];
{
  let bx = 0; let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (bx < MAX_LEVEL_W * TILE * 0.3 + VW + 200) {

function drawBackground(t) { THEMES[cur().theme].bg(t); }

function drawCloudPuffs(t, color) {
  ctx.fillStyle = color;
  for (const c of clouds) {
    const cx = ((c.x + t * c.spd - camX * 0.1) % (VW + 120) + VW + 120) % (VW + 120) - 60;
    ctx.fillRect(cx, c.y, c.w, 5);

function drawBirds(t, color) {

    ctx.fillRect(bx, by, 2, 1); ctx.fillRect(bx + 2, by - 1, 2, 1); ctx.fillRect(bx + 4, by, 2, 1);

function bgBay(t) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, "#0c1238");
  g.addColorStop(0.45, "#2c2260");
  g.addColorStop(0.72, "#8a3d5e");
  g.addColorStop(0.88, "#e07a4a");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // stars
  ctx.fillStyle = "#ffffff";
  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.6 + s.tw));
    ctx.globalAlpha = a * 0.8;
    ctx.fillRect(((s.x - camX * 0.05) % (VW + 20) + VW + 20) % (VW + 20) - 10, s.y, 1, 1);

  ctx.beginPath(); ctx.arc(270, 34, 11, 0, 7); ctx.fill();
  ctx.fillStyle = "#2c2260";
  ctx.beginPath(); ctx.arc(274, 31, 9, 0, 7); ctx.fill();

  // clouds
  ctx.fillStyle = "rgba(240,220,255,0.16)";
  for (const c of clouds) {
    const cx = ((c.x + t * c.spd - camX * 0.1) % (VW + 120) + VW + 120) % (VW + 120) - 60;
    ctx.fillRect(cx, c.y, c.w, 5);
    ctx.fillRect(cx + 5, c.y - 4, c.w * 0.6, 4);

  }

  const HOR = 172;

  // far skyline (parallax .25)
  const par = camX * 0.25;
  ctx.fillStyle = "#141b3e";
  for (const b of cityBuildings) {
    const sx = b.x - par;
    if (sx + b.w < -10 || sx > VW + 10) continue;
    ctx.fillRect(sx, HOR - b.h, b.w, b.h);
  }
  // lit windows
  ctx.fillStyle = "#ffd97a";
  for (const b of cityBuildings) {
    const sx = b.x - par;
    if (sx + b.w < -10 || sx > VW + 10) continue;
    for (let wy = HOR - b.h + 4; wy < HOR - 4; wy += 7) {
      for (let wx = 3; wx < b.w - 3; wx += 6) {
        if (((wx * 31 + wy * 17 + b.x) % 13) < 4) ctx.fillRect(sx + wx, wy, 2, 3);
      }
    }
  }

  // Singapore Flyer (parallax .3)
  {
    const fx = 520 - camX * 0.3, fy = 118, r = 32;
    if (fx > -60 && fx < VW + 60) {
      ctx.strokeStyle = "#3a4a8c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, 7); ctx.stroke();
      ctx.lineWidth = 1;
      const rot = t * 0.12;
      for (let i = 0; i < 8; i++) {
        const a = rot + i * Math.PI / 4;
        ctx.beginPath(); ctx.moveTo(fx, fy);
        ctx.lineTo(fx + Math.cos(a) * r, fy + Math.sin(a) * r); ctx.stroke();
        ctx.fillStyle = "#ffd97a";
        ctx.fillRect(fx + Math.cos(a) * r - 1.5, fy + Math.sin(a) * r - 1.5, 3, 3);
      }
      ctx.strokeStyle = "#3a4a8c";
      ctx.beginPath(); ctx.moveTo(fx - 12, HOR); ctx.lineTo(fx, fy); ctx.lineTo(fx + 12, HOR); ctx.stroke();
    }
  }

  // Marina Bay Sands (parallax .3)
  {
    const mx = 900 - camX * 0.3, my = HOR;
    if (mx > -120 && mx < VW + 120) {
      ctx.fillStyle = "#1b2547";
      for (let i = 0; i < 3; i++) {
        const tx = mx + i * 22;

        ctx.moveTo(tx, my); ctx.lineTo(tx + 4, my - 58);
        ctx.lineTo(tx + 12, my - 58); ctx.lineTo(tx + 16, my);
        ctx.closePath(); ctx.fill();
      }
      // skypark deck (the "boat")
      ctx.fillStyle = "#26335e";
      ctx.beginPath();
      ctx.moveTo(mx - 10, my - 58);
      ctx.quadraticCurveTo(mx + 30, my - 70, mx + 72, my - 58);
      ctx.lineTo(mx + 68, my - 52);
      ctx.quadraticCurveTo(mx + 30, my - 62, mx - 6, my - 52);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffd97a";
      for (let i = 0; i < 3; i++) {
        const tx = mx + i * 22;
        for (let wy = my - 52; wy < my - 6; wy += 8) ctx.fillRect(tx + 7, wy, 2, 3);
      }

  // bay water
  const wg = ctx.createLinearGradient(0, HOR, 0, VH);
  wg.addColorStop(0, "#233a75");

  ctx.fillStyle = "rgba(255,214,120,0.25)";
  for (let i = 0; i < 20; i++) {
    const rx = ((i * 53 + Math.floor(t * 10) * (i % 3 + 1)) % VW);
    ctx.fillRect(rx, HOR + 4 + (i * 13) % 40, 8 + (i % 3) * 4, 1);

/* ---------------- MRT rush hour: tunnel, ads, passing trains ---------------- */
let lastTrainCyc = 0;
function bgMRT(t) {

    ctx.beginPath(); ctx.arc(VW / 2, VH + 40, r, Math.PI, 2 * Math.PI); ctx.stroke();
  }

  for (let x = 10; x < VW + 44; x += 44) {
    const fl = 0.6 + 0.4 * Math.sin(t * 4 + x * 1.7);
    ctx.fillStyle = `rgba(220,235,255,${0.25 + fl * 0.35})`;
    ctx.fillRect(((x - camX * 0.1) % (VW + 44) + VW + 44) % (VW + 44) - 22, 14, 18, 3);
  }

  const HOR = 172;
  ctx.fillStyle = "#14161f";
  ctx.fillRect(0, 60, VW, HOR - 60);

  const ads = [["LAKSA -50%", "#c8402a"], ["BBT $2", "#3a6fd8"], ["TUITION 99", "#7b3a8e"], ["SALE SALE!", "#c8862a"], ["MERLIO", "#2e8a3a"]];
  ctx.font = "5px monospace";
  for (let i = 0; i < ads.length; i++) {
    const ax = ((i * 90 - camX * 0.15) % (VW + 90) + VW + 90) % (VW + 90) - 45;
    ctx.fillStyle = "#dfe3ea"; ctx.fillRect(ax, 78, 52, 30);
    ctx.fillStyle = ads[i][1]; ctx.fillRect(ax + 2, 80, 48, 26);
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "center";
    ctx.fillText(ads[i][0], ax + 26, 95);
    ctx.textAlign = "left";
  }

  ctx.fillStyle = "#0b0d16";
  ctx.fillRect(0, HOR, VW, VH - HOR);
  ctx.fillStyle = "rgba(255,210,63,0.5)";
  ctx.fillRect(0, HOR, VW, 1);
  ctx.strokeStyle = "#232a3d";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 205); ctx.lineTo(VW, 197); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 214); ctx.lineTo(VW, 206); ctx.stroke();

  const cyc = t % 12;
  if (cyc < 1.7) {
    const dir = Math.floor(t / 12) % 2 ? -1 : 1;
    const tx = dir > 0 ? -260 + (cyc / 1.7) * (VW + 520) : VW + 260 - (cyc / 1.7) * (VW + 520);
    ctx.fillStyle = "#aeb8c4"; ctx.fillRect(tx, 148, 240, 24);
    ctx.fillStyle = "#8a929e"; ctx.fillRect(tx, 148, 240, 3);
    ctx.fillStyle = "#d6402e"; ctx.fillRect(tx, 164, 240, 4);
    ctx.fillStyle = "#ffe9a8";
    for (let wx = 8; wx < 232; wx += 20) ctx.fillRect(tx + wx, 153, 12, 8);
    ctx.fillStyle = "#5f6672"; ctx.fillRect(tx + 2, 150, 4, 20);
  }
  if (cyc >= 0.05 && lastTrainCyc < 0.05) {
    sfx.train();
    if (state === "play") shake = Math.max(shake, 0.1);
  }
  lastTrainCyc = cyc;
}

/* ---------------- Jewel: rain vortex, rainbow, fireflies ---------------- */

function bgJewel(t) {

  }

    }
    ctx.fillStyle = "rgba(160,220,255,0.35)";

    const cols = ["#ff5b6e", "#ffb02e", "#ffd23f", "#5ce18a", "#5ce1e6", "#8a7cf2"];
    ctx.lineWidth = 2;
    cols.forEach((c, i) => {
      ctx.strokeStyle = c;
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(vx, HOR, 44 + i * 3, Math.PI, 2 * Math.PI); ctx.stroke();
    });

  for (const d of decorations) {

function drawSupertree(x, groundY, t) {

function drawPlats(t) {
  for (const pl of plats) {
    const sx = Math.round(pl.x - camX), sy = Math.round(pl.y);
    if (sx < -70 || sx > VW + 70) continue;
    if (pl.kind === "boat") {
      const bob = Math.sin(t * 2 + pl.x * 0.05) * 1.5;
      ctx.fillStyle = "#6e4520"; ctx.fillRect(sx, sy + bob, pl.w, 6);
      ctx.fillStyle = "#4a2c12"; ctx.fillRect(sx, sy + bob, 3, 8); ctx.fillRect(sx + pl.w - 3, sy + bob, 3, 8);
      ctx.fillStyle = "#8a5a2c"; ctx.fillRect(sx + 7, sy - 6 + bob, 2, 6); ctx.fillRect(sx + pl.w - 9, sy - 6 + bob, 2, 6);
      ctx.fillStyle = "#c8862a"; ctx.fillRect(sx + 6, sy - 9 + bob, pl.w - 12, 3);
      ctx.fillStyle = "#e8442c"; ctx.fillRect(sx + pl.w / 2 - 1, sy - 15 + bob, 6, 4);
    } else if (pl.kind === "trolley") {
      ctx.fillStyle = "#8a929e"; ctx.fillRect(sx, sy, pl.w, 5);
      ctx.fillStyle = "#5f6672"; ctx.fillRect(sx, sy, pl.w, 1);
      ctx.fillStyle = "#26335e"; ctx.fillRect(sx + 3, sy + 5, 3, 3); ctx.fillRect(sx + pl.w - 6, sy + 5, 3, 3);

      ctx.strokeStyle = "#3c465a"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(pl.x1 - camX), sy - 14);
      ctx.lineTo(Math.round(pl.x2 + pl.w - camX), sy - 14);
      ctx.stroke();
      ctx.fillStyle = "#3c465a"; ctx.fillRect(sx + pl.w / 2, sy - 14, 1, 4);
      ctx.fillStyle = "#d6402e"; ctx.fillRect(sx, sy - 10, pl.w, 12);
      ctx.fillStyle = "#ffe9a8"; ctx.fillRect(sx + 3, sy - 8, pl.w - 6, 4);
    } else {
      ctx.fillStyle = "rgba(140,255,180,0.45)"; ctx.fillRect(sx, sy, pl.w, 5);
      ctx.fillStyle = "#2e8a3a"; ctx.fillRect(sx, sy, pl.w, 1); ctx.fillRect(sx, sy + 4, pl.w, 1);
      ctx.fillStyle = "#7cf25c"; ctx.fillRect(sx + 2, sy + 1, 2, 3); ctx.fillRect(sx + pl.w - 4, sy + 1, 2, 3);

function drawJets(t) {
  for (const j of jets) {
    const sx = Math.round(j.x - camX);
    if (sx < -30 || sx > VW + 30) continue;
    const phase = jetPhase(j);
    const by = j.baseY;
    if (phase === "warn") {
      ctx.fillStyle = j.kind === "flame" ? "#ffb02e" : j.kind === "spark" ? "#fff3b0" : "#9fe8ff";
      for (let i = 0; i < 4; i++) {
        const yy = (t * 60 + i * 11) % 10;
        ctx.fillRect(sx + 3 + i * 3, by - 2 - yy, 2, 2);
      }
    } else if (phase === "on") {
      if (j.kind === "water") {
        ctx.fillStyle = "rgba(110,190,255,0.55)";
        ctx.fillRect(sx + 2, by - j.h, 12, j.h);
        ctx.fillStyle = "rgba(230,246,255,0.8)";
        for (let i = 0; i < 5; i++) ctx.fillRect(sx + 3 + i * 2, by - ((t * 160 + i * 23) % j.h), 2, 4);
      } else if (j.kind === "flame") {
        const fl = Math.sin(t * 30 + j.x) * 3;
        ctx.fillStyle = "#e8442c"; ctx.fillRect(sx + 1, by - j.h + fl, 14, j.h - fl);
        ctx.fillStyle = "#ffb02e"; ctx.fillRect(sx + 3, by - j.h + 6 + fl, 10, j.h - 6 - fl);
        ctx.fillStyle = "#fff3b0"; ctx.fillRect(sx + 5, by - j.h + 12 + fl, 6, j.h - 12 - fl);
      } else {
        ctx.fillStyle = "#fff3b0";
        for (let i = 0; i < 4; i++) {
          const yy = by - 10 - i * 9;
          const off = (Math.floor(t * 20 + i) % 2) ? 3 : -1;
          ctx.fillRect(sx + 6 + off, yy, 3, 9);
        }
        ctx.fillStyle = "#5ce1e6"; ctx.fillRect(sx + 2, by - 3, 12, 3);
      }
    }
  }
}

function drawFalls() {
  for (const f of falls) {
    const sx = Math.round(f.x - camX);
    if (sx < -20 || sx > VW + 20) continue;
    ctx.save();
    ctx.translate(sx, Math.round(f.y));
    ctx.rotate(f.y / 9);
    ctx.drawImage(SPR_COCO, -8, -8);
    ctx.restore();
  }
}

function drawUpdrafts(t) {
  for (const u of updrafts) {
    const sx = Math.round(u.x1 - camX), w = u.x2 - u.x1;
    if (sx + w < -20 || sx > VW + 20) continue;
    const base = 13 * TILE;
    ctx.fillStyle = "rgba(150,220,255,0.09)";
    ctx.fillRect(sx, u.top, w, base - u.top);
    ctx.fillStyle = "rgba(200,240,255,0.5)";
    for (let i = 0; i < 4; i++) {
      const yy = base - ((t * 110 + i * 31) % (base - u.top));
      ctx.fillRect(sx + 3 + Math.floor(i * w / 4), yy, 2, 8);
    }
    ctx.fillStyle = "rgba(150,220,255,0.25)";
    ctx.fillRect(sx, base - 2, w, 2);
  }
}

/* ---------------- world drawing ---------------- */
function drawTiles() {
  const groundTile = THEMES[cur().theme].ground;
  const x0 = Math.max(0, Math.floor(camX / TILE));
  const x1 = Math.min(levelW - 1, Math.ceil((camX + VW) / TILE));
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const t = grid[ty][tx];
      if (!t) continue;
      let dy = 0;
      const b = bumpMap[key(tx, ty)];
      if (b !== undefined) dy = -Math.sin((0.25 - b) / 0.25 * Math.PI) * 5;
      const sx = Math.round(tx * TILE - camX), sy = Math.round(ty * TILE + dy);
      if (t === 1)      ctx.drawImage(groundTile, sx, sy);
      else if (t === 2) ctx.drawImage(T_BRICK, sx, sy);
      else if (t === 3) ctx.drawImage(T_Q, sx, sy);
      else if (t === 4) ctx.drawImage(T_USED, sx, sy);
      else if (t === 5) ctx.drawImage(T_POLE, sx, sy);
      else if (t === 6) ctx.drawImage(THEMES[cur().theme].spike, sx, sy);
      else if (t === 7) ctx.drawImage(THEMES[cur().theme].bounce, sx, sy);
      else if (t === 8) ctx.drawImage(T_WET, sx, sy);
    }
  }
  // flag at top of pole
  const fx = Math.round(flagX * TILE - camX);
  if (fx > -40 && fx < VW + 40) {
    const wave = Math.sin(performance.now() / 300) * 1.5;
    ctx.drawImage(SPR_FLAG, fx + 10, 4 * TILE - 8 + wave);
    ctx.fillStyle = "#ffd23f";
    ctx.fillRect(fx + 6, 4 * TILE - 12, 5, 4);
  }
}

function drawCoins(t) {
  for (const c of coinsE) {
    if (c.taken) continue;
    const sx = Math.round(c.x - camX);
    if (sx < -20 || sx > VW + 20) continue;
    const ph = Math.cos(t * 5 + c.x * 0.15);
    const w = Math.max(2, Math.abs(ph) * 12);
    ctx.drawImage(SPR_COIN, 2, 0, 12, 12, sx + (12 - w) / 2, Math.round(c.y + Math.sin(t * 3 + c.x) * 1.5), w, 12);
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const sx = Math.round(e.x - camX - 1), sy = Math.round(e.y - 2);
    if (sx < -24 || sx > VW + 24) continue;
    if (e.squash > 0) { ctx.drawImage(e.kind === "durian" ? SPR_D_SQ : SQUASH[e.kind], sx, sy); continue; }
    const frames = ENEMY_SPR[e.kind];
    const spr = frames[Math.floor(e.anim) % frames.length];
    if (e.flung || e.kind === "coconut") {
      ctx.save();
      ctx.translate(sx + 8, sy + 8);
      ctx.rotate(e.flung ? performance.now() / 100 : e.x / 9);
      ctx.drawImage(spr, -8, -8);
      ctx.restore();
      continue;
    }
    const bob = e.kind === "tissue" ? Math.round(Math.sin(e.anim) * 1) : 0;
    if (e.vx > 0 && (e.kind === "pigeon" || e.kind === "tissue")) {
      ctx.save();
      ctx.translate(sx + 16, sy + bob);
      ctx.scale(-1, 1);
      ctx.drawImage(spr, 0, 0);
      ctx.restore();
    } else {
      ctx.drawImage(spr, sx, sy + bob);
    }
  }
}

function drawItems() {
  for (const it of items) {
    if (it.dead) continue;
    ctx.drawImage(SPR_CRAB, Math.round(it.x - camX - 1), Math.round(it.y - 1));
  }
}

function drawPlayer(t) {
  const p = player;
  if (state === "play" && p.inv > 0 && Math.floor(t * 16) % 2) return;
  let spr;
  if (!p.onGround) spr = SPR_P_JUMP;
  else if (Math.abs(p.vx) > 8) spr = Math.floor(p.anim) % 2 ? SPR_P_W1 : SPR_P_W2;
  else spr = SPR_P_STAND;
  const sx = Math.round(p.x - camX - 3), sy = Math.round(p.y - 2);
  ctx.save();
  if (p.power > 0) {
    const hue = (t * 500) % 360;
    ctx.filter = `hue-rotate(${hue}deg) saturate(1.6)`;
  }
  if (p.dir < 0) {
    ctx.translate(sx + 16, sy);
    ctx.scale(-1, 1);
    ctx.drawImage(spr, 0, 0);
  } else {
    ctx.drawImage(spr, sx, sy);
  }
  ctx.restore();
}

function drawFx() {
  for (const pa of particles) {
    ctx.globalAlpha = Math.min(1, pa.t * 2);
    ctx.fillStyle = pa.color;
    ctx.fillRect(Math.round(pa.x - camX), Math.round(pa.y), 2, 2);
  }
  ctx.globalAlpha = 1;
  ctx.font = "bold 7px monospace";
  for (const po of popups) {
    ctx.globalAlpha = Math.min(1, po.t * 2);
    ctx.fillStyle = "#000";
    ctx.fillText(po.txt, Math.round(po.x - camX) + 1, Math.round(po.y) + 1);
    ctx.fillStyle = po.color;
    ctx.fillText(po.txt, Math.round(po.x - camX), Math.round(po.y));
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, VW, 14);
  ctx.font = "bold 8px monospace";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("SCORE " + String(score).padStart(6, "0"), 6, 10);
  ctx.drawImage(SPR_COIN, 2, 0, 12, 12, 108, 3, 9, 9);
  ctx.fillText("x" + String(coinCount).padStart(2, "0"), 119, 10);
  ctx.fillStyle = "#ff5b6e";
  ctx.fillText("\u2665", 152, 10);
  ctx.fillStyle = "#ffffff";
  ctx.fillText("x" + lives, 160, 10);
  ctx.fillStyle = "#8fd0ff";
  ctx.fillText("L" + (levelIndex + 1), 178, 10);
  ctx.fillStyle = "#ffffff";
  ctx.fillText("TIME " + String(Math.max(0, Math.ceil(timeLeft))).padStart(3, "0"), 208, 10);
  if (player.power > 0) {
    ctx.fillStyle = "#ff5252";
    ctx.fillText("CHILLI! " + Math.ceil(player.power), 268, 10);
  }
  if (muted) { ctx.fillStyle = "#8899aa"; ctx.fillText("MUTE", 288, 24); }
}

function centerText(txt, y, size, color, outline) {
  ctx.font = "bold " + size + "px monospace";
  ctx.textAlign = "center";
  if (outline) {
    ctx.fillStyle = outline;
    for (const [ox, oy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[-1,-1]])
      ctx.fillText(txt, VW / 2 + ox, y + oy);
  }
  ctx.fillStyle = color;
  ctx.fillText(txt, VW / 2, y);
  ctx.textAlign = "left";
}

/* ---------------- screens ---------------- */
let tGlobal = 0;
function drawTitle(t) {
  camX = (t * 14) % (140 * TILE);
  drawBackground(t);
  for (const d of decorations) {
    if (d.type === "merlion") ctx.drawImage(SPR_MERLION, Math.round(d.x - camX), d.y, 32, 36);
    if (d.type === "hdb") drawHDB(Math.round(d.x - camX), 13 * TILE);
  }
  drawTiles(); drawCoins(t);

  ctx.fillStyle = "rgba(6,8,24,0.55)";
  ctx.fillRect(0, 0, VW, VH);

  const bob = Math.sin(t * 2) * 3;
  centerText("MERLIO", 74 + bob, 30, "#ffd23f", "#7c2415");
  centerText("SINGAPORE PIXEL ADVENTURE", 92 + bob, 9, "#ffffff", "#1a1a2e");

  ctx.drawImage(SPR_MERLION, VW / 2 - 60, 108, 32, 36);
  ctx.drawImage(SPR_P_STAND, VW / 2 - 8, 116, 32, 32);
  ctx.drawImage(SPR_D1, VW / 2 + 34, 124, 28, 28);

  centerText("STOMP THE DURIANS \u00b7 GRAB THE CHILLI CRAB", 166, 7, "#9fe8ff");
  centerText("5 LEVELS: BAY \u2192 HEARTLANDS \u2192 MRT \u2192 SENTOSA \u2192 JEWEL", 177, 7, "#ffd23f");
  centerText("ARROWS / WASD MOVE \u00b7 SPACE JUMP \u00b7 M MUTE", 188, 7, "#c9d4ff");
  if (Math.floor(t * 2) % 2) centerText("- PRESS ENTER TO START -", 206, 9, "#ffffff", "#000");
  centerText("MAJULAH SINGAPURA!", 226, 7, "#ff8896");
}

function drawIntroCard(t) {
  ctx.fillStyle = "rgba(6,8,24,0.62)";
  ctx.fillRect(0, 58, VW, 112);
  centerText("LEVEL " + (levelIndex + 1) + " / 5", 84, 9, "#9fe8ff");
  centerText(cur().name, 110, 20, "#ffd23f", "#7c2415");
  centerText(cur().sub, 132, 7, "#ffffff");
  if (Math.floor(t * 2) % 2) centerText("- GET READY LAH! -", 152, 8, "#ffffff", "#000");
}

function drawLevelDone(t) {
  ctx.fillStyle = "rgba(6,8,24,0.6)";
  ctx.fillRect(0, 52, VW, 124);
  centerText("LEVEL CLEAR!", 80, 18, "#ffd23f", "#7c2415");
  centerText(cur().clear, 100, 8, "#9fe8ff");
  centerText("SCORE " + score + "   COINS " + coinCount + "   LIVES " + lives, 118, 8, "#ffffff");
  if (Math.floor(t * 2) % 2) centerText("NEXT: " + LEVELS[levelIndex + 1].name + " \u2192", 142, 9, "#ffffff", "#000");
}

function drawWinOverlay(t) {
  ctx.fillStyle = "rgba(6,8,24,0.55)";
  ctx.fillRect(0, 34, VW, 132);
  centerText("MAJULAH CHAMPION!", 64, 18, "#ffd23f", "#7c2415");
  centerText("YOU CONQUERED ALL 5 LEVELS!", 84, 9, "#ffffff", "#000");
  centerText("MERLIO SAYS: SHIOK AH!", 98, 8, "#ff8896");
  centerText("SCORE " + score + "   COINS " + coinCount, 118, 8, "#9fe8ff");
  if (Math.floor(t * 2) % 2) centerText("- PRESS ENTER TO PLAY AGAIN -", 140, 8, "#ffffff", "#000");
  // fireworks
  if (Math.random() < 0.08) {
    const fx = camX + 40 + Math.random() * (VW - 80);
    burst(fx, 40 + Math.random() * 60,
      ["#ff5252","#ffd23f","#5ce1e6","#ff8ae2","#7cf25c"][Math.floor(Math.random() * 5)], 16, 100);
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  tGlobal += dt;
  DT = dt;

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;

  if (state === "title") { drawTitle(tGlobal); return; }

  /* --- update --- */
  if (state === "play") {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; killPlayer(false); }
    updatePlats(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateItems(dt);
    updateCoins(dt);
    updateJets(dt);
    updateFalls(dt);
    updateErps(dt);
  } else if (state === "intro") {
    introTimer += dt;
    if (introTimer > 2.4) state = "play";
  } else if (state === "dying") {
    deadTimer += dt;
    player.vy += GRAV * dt;
    player.y += player.vy * dt;
    if (deadTimer > 1.6) {
      lives--;
      if (lives <= 0) state = "gameover";
      else { resetPlayer(); spawnWorld(); timeLeft = cur().time; camX = 0; state = "play"; player.inv = 2; }
    }
  } else if (state === "winAnim") {
    winTimer += dt;
    const p = player;
    // slide to pole base then walk right
    if (p.y + p.h < 13 * TILE - 1) { p.x = flagX * TILE + 1; p.y += 90 * dt; p.vx = 0; }
    else { p.y = 13 * TILE - p.h; p.x += 55 * dt; p.dir = 1; p.anim += dt * 8; }
    if (winTimer > 2.6) {
      if (levelIndex < LEVELS.length - 1) { state = "levelDone"; doneTimer = 0; sfx.win(); }
      else state = "won";
    }
    updateEnemies(dt);
  } else if (state === "levelDone") {
    doneTimer += dt;
    if (doneTimer > 3.4) startLevel(levelIndex + 1);
  } else if (state === "won") {
    // idle celebrate
  }
  updateFx(dt);

  // camera
  if (state !== "won") {
    const target = player.x - VW * 0.38;
    camX += (target - camX) * Math.min(1, dt * 8);
    camX = Math.max(0, Math.min(camX, levelW * TILE - VW));
  }

  /* --- draw --- */
  const shx = shake > 0 ? (Math.random() - 0.5) * 5 : 0;
  const shy = shake > 0 ? (Math.random() - 0.5) * 5 : 0;
  ctx.setTransform(SCALE, 0, 0, SCALE, shx * SCALE, shy * SCALE);

  drawBackground(tGlobal);
  for (const d of decorations) {
    const sx = Math.round(d.x - camX);
    if (d.type === "merlion") ctx.drawImage(SPR_MERLION, sx, d.y, 32, 36);
    else if (d.type === "hdb") drawHDB(sx, 13 * TILE);
    else if (d.type === "sign") drawSign(sx, d.y, d.text);
    else if (d.type === "laundry") drawLaundry(sx, 13 * TILE, tGlobal);
    else if (d.type === "kopitiam") drawKopitiam(sx, 13 * TILE);
    else if (d.type === "palm") drawPalm(sx, 13 * TILE, tGlobal);
    else if (d.type === "mrtsign") drawMrtSign(sx, 13 * TILE);
    else if (d.type === "controltower") drawControlTower(sx, 13 * TILE, tGlobal);
    else if (d.type === "wetsign") drawWetSign(sx, 13 * TILE);
  }
  for (const e of erps) drawErp(e);
  drawUpdrafts(tGlobal);
  drawTiles();
  drawPlats(tGlobal);
  drawJets(tGlobal);
  drawCoins(tGlobal);
  drawItems();
  drawFalls();
  drawEnemies();
  if (!(state === "dying" && deadTimer > 1.3)) drawPlayer(tGlobal);
  drawFx();
  drawHUD();

  if (state === "intro") drawIntroCard(tGlobal);
  if (state === "levelDone") drawLevelDone(tGlobal);

  if (state === "gameover") {
    ctx.fillStyle = "rgba(6,8,24,0.7)";
    ctx.fillRect(0, 0, VW, VH);
    centerText("GAME OVER LAH!", 100, 18, "#ff5b6e", "#2a0a10");
    centerText("SCORE " + score, 122, 9, "#ffffff");
    if (Math.floor(tGlobal * 2) % 2) centerText("- PRESS ENTER TO RETRY -", 146, 8, "#ffffff", "#000");
  }
  if (state === "won") drawWinOverlay(tGlobal);
}

/* ---------------- boot ---------------- */
loadLevel(START_IDX);
score = 0; coinCount = 0; lives = 3;
state = "title";
requestAnimationFrame(frame);
</script>
</body>
</html>
