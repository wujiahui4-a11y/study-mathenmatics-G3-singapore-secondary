<style>
:root {
  color-scheme: dark;
  --bg: #14161a;
  --bar: #1c1f26;
  --line: #2b303b;
  --fg: #e7e9ee;
  --muted: #9aa3b2;
  --accent: #4c8dff;
  --danger: #e5534b;
  --ok: #3fb950;
  --warn: #d29922;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

/* Elements below set display:grid/flex, which outranks the UA [hidden] rule. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

body { display: flex; flex-direction: column; }

.bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}

.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand .sub {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.dot[data-state="connecting"] { background: var(--warn); animation: pulse 1s infinite; }
.dot[data-state="connected"] { background: var(--ok); }
.dot[data-state="error"] { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }

.actions { display: flex; flex-wrap: wrap; gap: 6px; }

button {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #262b35;
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: #2e3440; border-color: #3c4454; }
button:disabled { opacity: .45; cursor: not-allowed; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.primary:hover:not(:disabled) { background: #3d7ce8; }
.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

.stage { flex: 1 1 auto; position: relative; min-height: 0; background: #000; overflow: hidden; }

.panel {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: start center;
  padding: 20px 16px;
  overflow-y: auto;
  background: var(--bg);
}

.card {
  width: min(520px, 100%);
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bar);
}

.card h1 { margin: 0 0 4px; font-size: 18px; }
.card .who { margin: 0 0 18px; color: var(--muted); font-size: 12px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.span2 { grid-column: 1 / -1; }
.field > span { font-size: 12px; color: var(--muted); }
.field em { font-style: normal; opacity: .75; }

input[type="text"], input[type="password"], input[type="number"], textarea {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #11141a;
  color: var(--fg);
  font: inherit;
}
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.toggles {
  margin: 16px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  gap: 7px;
}
.toggles legend { padding: 0 6px; font-size: 12px; color: var(--muted); }
.toggles label { display: flex; gap: 8px; align-items: center; font-size: 13px; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
.note code { font-family: var(--mono); background: #00000040; padding: 1px 5px; border-radius: 4px; }
.msg { margin: 14px 0 0; font-size: 13px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); border-left-width: 3px; }
.msg[data-kind="error"] { border-left-color: var(--danger); }
.msg[data-kind="ok"] { border-left-color: var(--ok); }
.msg[data-kind="info"] { border-left-color: var(--accent); }
.msg[hidden] { display: none; }

dialog {
  width: min(520px, calc(100vw - 32px));
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bar);
  color: var(--fg);
}
dialog::backdrop { background: #000b; }
dialog h2 { margin: 0 0 12px; font-size: 16px; }
dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 16px 0 0; padding: 0; }

.toasts {
  position: fixed;
  right: 12px;
  bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 50;
  max-width: min(360px, calc(100vw - 24px));
}
.toast {
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-radius: 8px;
  background: var(--bar);
  font-size: 13px;
  box-shadow: 0 6px 24px #0008;
}
.toast[data-kind="error"] { border-left-color: var(--danger); }
.toast[data-kind="ok"] { border-left-color: var(--ok); }
.toast[data-kind="info"] { border-left-color: var(--accent); }

@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  .field.span2 { grid-column: auto; }
  .brand .sub { display: none; }
}
</style>
