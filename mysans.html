<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY SANS — JIAHUI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #04050c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; line-height: 0; box-shadow: 0 0 70px rgba(80,110,255,.18); }
  canvas {
    width: min(960px, 100vw);
    height: auto; max-height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; background: #000;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="720"></canvas></div>

<script>
"use strict";
/* ==========================================================
   MY SANS — JIAHUI
   An undertale-STYLE fan story. Every pixel drawn by hand
   in code — no borrowed assets, no sound (yet).
   Kembangan Path · night · rain.
   ========================================================== */

const W = 320, H = 240, SCALE = 3;
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = false;

const FONT = '"Press Start 2P", monospace';
function setFont(g, s = 8) { g.font = s + "px " + FONT; g.textBaseline = "top"; }

/* ---------------- input ---------------- */
const keys = {};
let zHit = false, xHit = false;
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.code] = true;
  if ((e.code === "KeyZ" || e.code === "Enter" || e.code === "Space") && !e.repeat) zHit = true;
  if (e.code === "KeyX" && !e.repeat) xHit = true;
  if (e.code === "KeyR" && mode === "end") location.reload();
});
addEventListener("keyup", e => keys[e.code] = false);
addEventListener("mousedown", () => { zHit = true; });
const left  = () => keys.ArrowLeft || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;
const up    = () => keys.ArrowUp || keys.KeyW;
const down  = () => keys.ArrowDown || keys.KeyS;

/* ---------------- tiny helpers ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

/* typewriter */
function tw(text, speed = 28) { return { text, n: 0, speed, done: false }; }
function twUpdate(t, dt) {
  if (!t || t.done) return;
  t.n += dt * t.speed;
  if (t.n >= t.text.length) { t.n = t.text.length; t.done = true; }
}
function twSkip(t) { if (t) { t.n = t.text.length; t.done = true; } }
function twText(t) { return t ? t.text.slice(0, Math.floor(t.n)) : ""; }

function wrap(g, text, x, y, maxW, lh, color) {
  g.fillStyle = color;
  const words = text.split(" ");
  let line = "", yy = y;
  for (const w2 of words) {
    const test = line ? line + " " + w2 : w2;
    if (g.measureText(test).width > maxW && line) {
      g.fillText(line, x, yy);
      yy += lh; line = w2;
    } else line = test;
  }
  if (line) g.fillText(line, x, yy);
  return yy + lh;
}

/* ---------------- heart sprite (clean, flat, no shine) ---------------- */
const HEART_ROWS = [
  ".XX...XX.",
  "XXXX.XXXX",
  "XXXXXXXXX",
  "XXXXXXXXX",
  ".XXXXXXX.",
  "..XXXXX..",
  "...XXX...",
  "....X....",
];
/* bake once per colour, then scale with nearest-neighbour: no grid seams */
const heartCache = {};
function heartCanvas(color) {
  if (heartCache[color]) return heartCache[color];
  const c = document.createElement("canvas");
  c.width = 9; c.height = 8;
  const g = c.getContext("2d");
  g.fillStyle = color;
  for (let r = 0; r < HEART_ROWS.length; r++)
    for (let col = 0; col < 9; col++)
      if (HEART_ROWS[r][col] === "X") g.fillRect(col, r, 1, 1);
  heartCache[color] = c;
  return c;
}
function drawHeart(g, x, y, s = 1, color = "#ff0030", ang = 0) {
  g.imageSmoothingEnabled = false;
  const w = Math.round(9 * s), h = Math.round(8 * s);
  if (!ang) {
    g.drawImage(heartCanvas(color), Math.round(x), Math.round(y), w, h);
    return;
  }
  g.save();
  g.translate(Math.round(x) + w / 2, Math.round(y) + h / 2);
  g.rotate(ang);
  g.drawImage(heartCanvas(color), -w / 2, -h / 2, w, h);
  g.restore();
}
/* the tip of the heart points along gravity, like the blue soul slam */
const HEART_ANG = { down: 0, up: Math.PI, left: Math.PI / 2, right: -Math.PI / 2 };

/* ==========================================================
   PEOPLE (overworld pixel sprites, hand-painted)
   ========================================================== */
function drawPerson(g, x, feetY, o) {
  /* thin anime-style boy, 16px box, feet resting on feetY.
     o: dir, step, walking, t, hair, hairHi, skin, jacket, jhi, shorts, tall, pockets, ahoge, glow */
  const tall = o.tall || 0;
  const t = o.t || 0;
  const step = o.walking ? (o.step ? 1 : -1) : 0;
  const bob = o.walking ? (o.step ? -1 : 0) : (Math.sin(t * 2.1) < -.35 ? 1 : 0);
  const H2 = 29 + tall;
  const ty = feetY - H2 + bob;
  const J = o.jacket, JH = o.jhi, SKIN = o.skin, HAIR = o.hair, HH = o.hairHi || o.jhi;
  const dir = o.dir || "down";
  const side = dir === "left" ? -1 : dir === "right" ? 1 : 0;
  const legTop = ty + 22 + tall;

  /* --- thin legs + slippers --- */
  g.fillStyle = SKIN;
  if (side) {
    g.fillRect(x + 7 - step, legTop, 2, 5);
    g.fillRect(x + 7 + step, legTop, 2, 5);
  } else {
    g.fillRect(x + 5, legTop + (o.walking && step > 0 ? 1 : 0), 2, 5);
    g.fillRect(x + 9, legTop + (o.walking && step < 0 ? 1 : 0), 2, 5);
  }
  g.fillStyle = "#f2f2f2";
  if (side) {
    g.fillRect(x + 5 - step, feetY - 2, 3, 2);
    g.fillRect(x + 8 + step, feetY - 2, 3, 2);
  } else {
    g.fillRect(x + 4, feetY - 2, 3, 2);
    g.fillRect(x + 9, feetY - 2, 3, 2);
  }
  g.fillStyle = "#ff8fb0";
  g.fillRect(x + (side ? 6 - step : 5), feetY - 2, 1, 1);
  g.fillRect(x + (side ? 9 + step : 10), feetY - 2, 1, 1);

  /* --- shorts --- */
  g.fillStyle = o.shorts;
  g.fillRect(x + 4, ty + 19 + tall, 8, 3);
  g.fillStyle = "#e8e8e8";
  g.fillRect(x + 4, ty + 20 + tall, 8, 1);

  /* --- slim jacket torso --- */
  g.fillStyle = J;
  g.fillRect(x + 5, ty + 11, 6, 8 + tall);
  g.fillStyle = JH;
  g.fillRect(x + 5, ty + 11, 6, 1);
  g.fillRect(x + 5, ty + 10, 6, 1);            /* hood roll behind neck */
  if (dir === "down") {
    g.fillStyle = "#dfe8f2";
    g.fillRect(x + 8, ty + 12, 1, 7 + tall);   /* zipper */
    g.fillRect(x + 6, ty + 12, 1, 2);          /* drawstrings */
    g.fillRect(x + 9, ty + 12, 1, 2);
  }
  /* --- arms --- */
  g.fillStyle = J;
  if (o.pockets && dir === "down") {
    g.fillRect(x + 3, ty + 12, 2, 4);
    g.fillRect(x + 11, ty + 12, 2, 4);
    g.fillRect(x + 4, ty + 15, 2, 2);
    g.fillRect(x + 10, ty + 15, 2, 2);
  } else if (side) {
    g.fillRect(x + 7, ty + 12 + step, 2, 5);
    g.fillStyle = SKIN;
    g.fillRect(x + 7, ty + 17 + step, 2, 1);
  } else {
    g.fillRect(x + 3, ty + 12 - step, 2, 5);
    g.fillRect(x + 11, ty + 12 + step, 2, 5);
    g.fillStyle = SKIN;
    g.fillRect(x + 3, ty + 17 - step, 2, 1);
    g.fillRect(x + 11, ty + 17 + step, 2, 1);
  }

  /* --- neck + head --- */
  g.fillStyle = SKIN;
  g.fillRect(x + 7, ty + 10, 2, 1);
  g.fillRect(x + 4, ty + 3, 8, 7);
  /* --- anime hair --- */
  g.fillStyle = HAIR;
  if (dir === "up") {
    g.fillRect(x + 3, ty, 10, 9);
    g.fillRect(x + 4, ty + 9, 2, 1); g.fillRect(x + 7, ty + 9, 2, 1); g.fillRect(x + 10, ty + 9, 2, 1);
    g.fillStyle = HH; g.fillRect(x + 5, ty + 1, 4, 1);
  } else if (dir === "down") {
    g.fillRect(x + 3, ty, 10, 3);
    g.fillRect(x + 3, ty + 3, 1, 5);            /* side locks */
    g.fillRect(x + 12, ty + 3, 1, 5);
    g.fillRect(x + 4, ty + 3, 2, 1);            /* fringe */
    g.fillRect(x + 7, ty + 3, 2, 1);
    g.fillRect(x + 10, ty + 3, 2, 1);
    g.fillRect(x + 4, ty + 4, 1, 1);
    g.fillRect(x + 8, ty + 4, 1, 1);
    g.fillRect(x + 11, ty + 4, 1, 1);
    g.fillStyle = HH; g.fillRect(x + 5, ty + 1, 3, 1);
  } else {
    g.fillRect(x + 3, ty, 10, 3);
    const back = side < 0 ? x + 11 : x + 3;
    g.fillRect(back, ty + 3, 2, 5);
    const front = side < 0 ? x + 4 : x + 10;
    g.fillRect(front, ty + 3, 2, 2);
    g.fillStyle = HH; g.fillRect(x + 5, ty + 1, 3, 1);
  }
  if (o.ahoge && dir !== "up") {
    g.fillStyle = HAIR;
    g.fillRect(x + 8, ty - 2, 1, 2);
    g.fillRect(x + 9, ty - 3, 1, 2);
  }
  /* --- face --- */
  if (dir === "down") {
    g.fillStyle = "#20222c";
    g.fillRect(x + 5, ty + 6, 2, 2);
    g.fillRect(x + 9, ty + 6, 2, 2);
    g.fillStyle = "#b8875e";
    g.fillRect(x + 7, ty + 8, 2, 1);
    if (o.glow > 0) {
      const c = Math.floor(t * 8) % 2 ? "#ffa030" : "#40c8ff";
      g.fillStyle = c;
      g.fillRect(x + 5, ty + 6, 2, 2);
      g.globalAlpha = .35 * o.glow;
      g.fillRect(x + 4, ty + 5, 4, 4);
      g.globalAlpha = 1;
    }
  } else if (side) {
    g.fillStyle = "#20222c";
    g.fillRect(side < 0 ? x + 5 : x + 9, ty + 6, 2, 2);
  }
}

const FRISK = { hair: "#7a4a28", hairHi: "#9a6438", skin: "#f2c992", jacket: "#2a5ad8", jhi: "#4a7af8", shorts: "#20222c" };
const JIAHUI = { hair: "#1c1e26", hairHi: "#3a4058", skin: "#f0c890", jacket: "#2a5ad8", jhi: "#4a7af8", shorts: "#20222c", tall: 2, pockets: true, ahoge: true };

/* ---------------- portrait head (dialogue) — anime style ---------------- */
function drawHead(g, x, y, kind, t) {
  /* 36x36 anime pixel head of jiahui */
  g.fillStyle = "#000"; g.fillRect(x, y, 36, 36);
  g.strokeStyle = "#fff"; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, 35, 35);
  const s = "#f0c890", sh = "#d8a870", h = "#1c1e26", hh = "#3a4058", dk = "#20222c";

  /* face with tapered anime jaw */
  g.fillStyle = s;
  g.fillRect(x + 9, y + 10, 18, 16);
  g.fillRect(x + 11, y + 26, 14, 3);
  g.fillRect(x + 14, y + 29, 8, 2);

  /* hair: big layered mass + fringe + long side bangs */
  g.fillStyle = h;
  g.fillRect(x + 6, y + 3, 24, 8);
  g.fillRect(x + 5, y + 6, 3, 15);
  g.fillRect(x + 28, y + 6, 3, 15);
  /* fringe locks over the forehead */
  g.fillRect(x + 8, y + 11, 4, 3);  g.fillRect(x + 9, y + 14, 2, 2);
  g.fillRect(x + 13, y + 11, 4, 2); g.fillRect(x + 14, y + 13, 2, 2);
  g.fillRect(x + 18, y + 11, 3, 4); g.fillRect(x + 19, y + 15, 1, 1);
  g.fillRect(x + 22, y + 11, 4, 2); g.fillRect(x + 23, y + 13, 2, 3);
  g.fillRect(x + 27, y + 11, 3, 3);
  /* ahoge */
  g.fillRect(x + 17, y + 1, 2, 2); g.fillRect(x + 19, y, 1, 2);
  /* sheen */
  g.fillStyle = hh;
  g.fillRect(x + 9, y + 5, 7, 1); g.fillRect(x + 20, y + 4, 5, 1);

  /* eyes (anime: lash line + iris + catchlight) */
  const exL = x + 10, exR = x + 21, ey = y + 18;
  if (kind === "glow") {
    g.fillStyle = "#0a0a12";
    g.fillRect(exL, ey, 6, 5);
    g.fillRect(exR, ey + 1, 6, 3);
    const c = Math.floor(t * 9) % 2 ? "#ffa030" : "#40c8ff";
    g.fillStyle = c;
    g.fillRect(exL + 2, ey + 1, 2, 2);
    g.fillRect(exL + 2, ey - 1, 2, 1);      /* flare up */
    g.fillRect(exL + 2, ey + 4, 2, 1);      /* flare down */
    g.fillStyle = "#fff";
    g.fillRect(exL + 2, ey + 1, 1, 1);
  } else if (kind === "serious") {
    g.fillStyle = dk;
    g.fillRect(exL, ey, 6, 2);
    g.fillRect(exR, ey, 6, 2);
    g.fillRect(exL + 2, ey + 2, 2, 2);
    g.fillRect(exR + 2, ey + 2, 2, 2);
    /* knitted brows */
    g.fillRect(exL + 1, ey - 3, 5, 1); g.fillRect(exL + 4, ey - 2, 2, 1);
    g.fillRect(exR, ey - 2, 2, 1);     g.fillRect(exR + 1, ey - 3, 5, 1);
  } else {
    /* calm: relaxed half-lidded */
    g.fillStyle = dk;
    g.fillRect(exL, ey, 6, 1);
    g.fillRect(exR, ey, 6, 1);
    g.fillRect(exL + 2, ey + 1, 3, 3);
    g.fillRect(exR + 1, ey + 1, 3, 3);
    g.fillStyle = "#fff";
    g.fillRect(exL + 3, ey + 1, 1, 1);
    g.fillRect(exR + 2, ey + 1, 1, 1);
  }
  /* tired eye-bags */
  g.fillStyle = sh;
  g.fillRect(exL + 1, y + 23, 3, 1);
  g.fillRect(exR + 1, y + 23, 3, 1);
  /* nose + small mouth */
  g.fillStyle = sh; g.fillRect(x + 18, y + 24, 1, 1);
  g.fillStyle = dk;
  if (kind === "glow") {
    g.fillRect(x + 14, y + 27, 8, 1);
  } else {
    g.fillRect(x + 15, y + 27, 5, 1);
    g.fillRect(x + 20, y + 26, 1, 1);
  }
}

/* ==========================================================
   OVERWORLD — Kembangan Path at night, in the rain
   ========================================================== */
const WORLD_W = 1280;
const player = { x: 60, y: 176, dir: "down", walkT: 0, walking: false };
const npc = { x: 1064, y: 168, t: 0, glow: 0 };
let camX = 0;
let met1 = false, met2 = false;

/* deterministic city detail */
const R1 = rnd(77);
const blocks = [];
{
  let bx = -40;
  const cols = ["#31456e", "#3c5a74", "#54467a", "#2e5e60", "#5e4660"];
  while (bx < WORLD_W + 80) {
    const w2 = 60 + R1() * 60, h2 = 30 + R1() * 16;
    blocks.push({ x: bx, w: w2, h: h2, c: cols[Math.floor(R1() * cols.length)], seed: Math.floor(R1() * 999) });
    bx += w2 + 6;
  }
}
const flowers = [];
{
  const R2 = rnd(31);
  for (let i = 0; i < 90; i++)
    flowers.push({ x: R2() * WORLD_W, y: 196 + R2() * 38, c: ["#ff6a8e","#ffd23f","#7cf25c","#5ce1e6","#d88cff"][Math.floor(R2() * 5)] });
}

/* rain */
const drops = [];
for (let i = 0; i < 110; i++) drops.push({ x: Math.random() * (W + 40), y: Math.random() * H, s: 150 + Math.random() * 120 });
const splashes = [];

/* vehicles */
const cars = [];
let carTimer = 1, busTimer = 3.5;
const CAR_COLORS = ["#d84a4a", "#e8b23a", "#4a90d8", "#b8bcc4", "#7a52c8", "#48c87c"];

function updateWorld(dt, allowMove) {
  player.walking = false;
  if (allowMove) {
    let dx = 0, dy = 0;
    if (left()) dx -= 1; if (right()) dx += 1;
    if (up()) dy -= 1; if (down()) dy += 1;
    if (dx || dy) {
      const l2 = Math.hypot(dx, dy);
      player.x += dx / l2 * 62 * dt;
      player.y += dy / l2 * 62 * dt;
      player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      player.walking = true;
      player.walkT += dt;
    }
    player.x = clamp(player.x, 8, WORLD_W - 20);
    player.y = clamp(player.y, 146, 212);
  }
  camX = clamp(player.x - 150, 0, WORLD_W - W);
  npc.t += dt;

  /* vehicles */
  carTimer -= dt;
  if (carTimer <= 0) {
    carTimer = 1.6 + Math.random() * 2.4;
    const dir = Math.random() < .5 ? 1 : -1;
    cars.push({ type: "car", x: dir > 0 ? camX - 60 : camX + W + 60, dir, sp: 65 + Math.random() * 40, y: dir > 0 ? 118 : 103, c: CAR_COLORS[Math.floor(Math.random() * 6)] });
  }
  busTimer -= dt;
  if (busTimer <= 0) {
    busTimer = 9 + Math.random() * 5;
    cars.push({ type: "bus", x: camX - 90, dir: 1, sp: 52, y: 113 });
  }
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    c.x += c.dir * c.sp * dt;
    if (c.x < camX - 160 || c.x > camX + W + 160) cars.splice(i, 1);
  }

  /* rain */
  for (const d of drops) {
    d.y += d.s * dt; d.x -= d.s * .22 * dt;
    if (d.y > H) {
      d.y = -6; d.x = Math.random() * (W + 60);
      if (Math.random() < .5) splashes.push({ x: Math.random() * W, y: 140 + Math.random() * 96, t: 0 });
    }
  }
  for (let i = splashes.length - 1; i >= 0; i--) {
    splashes[i].t += dt;
    if (splashes[i].t > .35) splashes.splice(i, 1);
  }
}

function drawWorld(g, t) {
  /* sky */
  const sky = g.createLinearGradient(0, 0, 0, 96);
  sky.addColorStop(0, "#070a1e"); sky.addColorStop(1, "#141b3e");
  g.fillStyle = sky; g.fillRect(0, 0, W, 96);
  /* moon glow behind cloud */
  g.fillStyle = "rgba(220,230,255,.13)";
  g.beginPath(); g.arc(250 - camX * .05, 22, 16, 0, 7); g.fill();
  g.fillStyle = "rgba(200,215,255,.5)";
  g.beginPath(); g.arc(250 - camX * .05, 22, 7, 0, 7); g.fill();
  g.fillStyle = "rgba(10,14,34,.8)";
  g.fillRect(220 - camX * .05, 18, 70, 5);
  g.fillRect(232 - camX * .05, 26, 55, 4);

  /* HDB blocks */
  for (const b of blocks) {
    const sx = b.x - camX * .6;
    if (sx + b.w < -10 || sx > W + 10) continue;
    g.fillStyle = b.c;
    g.fillRect(sx, 92 - b.h, b.w, b.h);
    g.fillStyle = "rgba(0,0,0,.25)";
    g.fillRect(sx, 92 - b.h, b.w, 2);
    const rr = rnd(b.seed + 5);
    for (let wy = 92 - b.h + 5; wy < 88; wy += 7) {
      for (let wx = sx + 4; wx < sx + b.w - 4; wx += 8) {
        const on = rr() < .55;
        g.fillStyle = on ? ["#ffd97a", "#9fe8ff", "#ffb4d8"][Math.floor(rr() * 3)] : "#1a2030";
        g.fillRect(wx, wy, 4, 4);
      }
    }
  }

  /* road */
  g.fillStyle = "#191c24"; g.fillRect(0, 96, W, 40);
  g.fillStyle = "#3a3f4c";
  for (let x = -((camX % 26)), i2 = 0; x < W; x += 26, i2++) g.fillRect(x, 115, 14, 2);
  /* wet lamp reflections on road */
  for (let lx = 80; lx < WORLD_W; lx += 152) {
    const sx = lx - camX;
    if (sx < -20 || sx > W + 20) continue;
    g.fillStyle = "rgba(255,214,120,.10)";
    g.fillRect(sx - 2, 98, 5, 36);
  }

  /* vehicles */
  for (const c of cars) drawVehicle(g, c, t);

  /* kerb + railing */
  g.fillStyle = "#3c424e"; g.fillRect(0, 136, W, 3);
  g.fillStyle = "#2e9648";
  for (let x = -((camX % 14)); x < W; x += 14) g.fillRect(x, 132, 2, 5);
  g.fillRect(0, 131, W, 2);

  /* footpath — colorful paving */
  for (let ty = 139; ty < 194; ty += 6) {
    for (let x = -((camX % 12)) - 12, i2 = Math.floor(camX / 12); x < W; x += 12, i2++) {
      const v = (i2 * 7 + ty) % 24;
      g.fillStyle = v < 10 ? "#c9885a" : v < 18 ? "#e0aa6e" : v < 21 ? "#b85a4a" : "#4a9a94";
      g.fillRect(x, ty, 11, 5);
    }
  }
  g.fillStyle = "#8a5a3c"; g.fillRect(0, 138, W, 1); g.fillRect(0, 193, W, 1);

  /* grass + flowers */
  g.fillStyle = "#1d4a2c"; g.fillRect(0, 194, W, 46);
  g.fillStyle = "#296038";
  for (let x = -((camX % 9)); x < W; x += 9) g.fillRect(x, 196 + (x * 7 % 30), 2, 2);
  for (const f of flowers) {
    const sx = f.x - camX;
    if (sx < -4 || sx > W + 4) continue;
    g.fillStyle = f.c; g.fillRect(sx, f.y, 2, 2);
    g.fillStyle = "#3c8050"; g.fillRect(sx, f.y + 2, 1, 2);
  }

  /* sign */
  {
    const sx = 96 - camX;
    if (sx > -140 && sx < W) {
      g.fillStyle = "#5c4630"; g.fillRect(sx + 60, 150, 3, 14);
      g.fillStyle = "#0e7a48"; g.fillRect(sx, 140, 124, 13);

      setFont(g, 6.5);
      g.fillStyle = "#fff";
      g.fillText("KEMBANGAN PATH", sx + 7, 144);
    }
  }

  /* lamps + light pools */
  for (let lx = 80; lx < WORLD_W; lx += 152) {
    const sx = lx - camX;

    g.fillStyle = "rgba(255,220,130,.16)";

    g.beginPath(); g.moveTo(sx - 3, 118); g.lineTo(sx - 26, 172); g.lineTo(sx + 26, 172); g.lineTo(sx + 3, 118); g.fill();
    g.fillStyle = "#3a4552";

    g.fillRect(sx - 5, 116, 10, 2);
    g.fillStyle = "#ffe9a8"; g.fillRect(sx - 3, 118, 6, 3);
  }

  /* npc jiahui */
  drawPerson(g, npc.x - camX, npc.y + 1, { ...JIAHUI, dir: "down", t: npc.t, glow: npc.glow });
  if (npc.glow > 0) {
    g.fillStyle = `rgba(80,160,255,${npc.glow * .1})`;
    g.beginPath(); g.arc(npc.x - camX + 8, npc.y - 20, 16, 0, 7); g.fill();
  }

  /* player */
  drawPerson(g, player.x - camX, player.y + 1, {
    ...FRISK, dir: player.dir, walking: player.walking,
    step: Math.floor(player.walkT * 7) % 2, t: player.walkT,
  });

  /* rain (over everything) */
  g.strokeStyle = "rgba(160,200,255,.42)";
  g.lineWidth = 1;
  g.beginPath();
  for (const d of drops) {
    g.moveTo(d.x, d.y);
    g.lineTo(d.x - 1.6, d.y + 7);
  }
  g.stroke();
  for (const s of splashes) {
    const p = s.t / .35;
    g.strokeStyle = `rgba(170,210,255,${.5 * (1 - p)})`;
    g.beginPath(); g.ellipse(s.x, s.y, 2 + p * 4, 1 + p * 1.5, 0, 0, 7); g.stroke();
  }
  /* soft night tint */
  g.fillStyle = "rgba(10,16,50,.14)";
  g.fillRect(0, 0, W, H);
}

let dlg = null;   /* {lines:[{head,text}], i, tw, onClose} */
function openDlg(lines, onClose) {
  dlg = { lines, i: 0, tw: tw(lines[0].text), onClose };
}
function updateDlg(dt) {
  if (!dlg) return;
  twUpdate(dlg.tw, dt);
  if (xHit) twSkip(dlg.tw);
  if (zHit) {
    zHit = false;
    if (!dlg.tw.done) twSkip(dlg.tw);
    else {
      dlg.i++;
      if (dlg.i >= dlg.lines.length) {
        const cb = dlg.onClose; dlg = null;
        if (cb) cb();
      } else dlg.tw = tw(dlg.lines[dlg.i].text);
    }
  }
}
function drawDlg(g, t) {
  if (!dlg) return;

function artClip(g, fn, t) {
  g.save();
  g.beginPath(); g.rect(48, 22, 224, 124); g.clip();
  g.translate(48, 22);

function stickKid(g, x, y, c, o = {}) {

}

function addSpike(edge, pos, len, w, kind, vel = 0) {
  spikes.push({ edge, pos, len: 0, target: len, w, kind, vel, ph: Math.random() * 9 });
}
function addFullWall(pos, kind, vel) {
  addSpike("bottom", pos, BOX.h - 8, 9, kind, vel);
}
function addWallGap(pos, gapY, gapH, kind, vel) {
  const topLen = clamp(gapY - gapH / 2 - (BOX.y + 2), 0, BOX.h - 6);
  const botLen = clamp((BOX.y + BOX.h - 2) - (gapY + gapH / 2), 0, BOX.h - 6);
  if (topLen > 3) addSpike("top", pos, topLen, 9, kind, vel);
  if (botLen > 3) addSpike("bottom", pos, botLen, 9, kind, vel);
}
function addBlaster(axis, at) {
  blasters.push({ axis, at, t: 0 });
}
function setGravity(d) {
  if (soul.gdir === d && soul.mode === "blue") return;
  soul.mode = "blue";
  soul.gdir = d;
  soul.slam = true;
  soul.vx = 0; soul.vy = 0;
}
function flipAndSpikes(dir) {
  setGravity(dir);
  if (dir === "down" || dir === "up") {
    const edge = dir === "down" ? "bottom" : "top";
    for (let i = 0; i < 3; i++)
      addSpike(edge, BOX.x + BOX.w + 14 + i * 36, 14 + Math.random() * 9, 10, "multi", -95);
  } else {
    for (let i = 0; i < 3; i++)
      addSpike(dir, BOX.y + BOX.h + 14 + i * 30, 13 + Math.random() * 8, 10, "multi", -80);
  }
}
function every(key, interval, first = 0) {
  const k = battle.tm;
  if (k[key] === undefined) k[key] = first;
  if (battle.atkT >= k[key]) { k[key] += interval; return true; }
  return false;
}
function once(key, time) {
  if (!battle.tm["o" + key] && battle.atkT >= time) { battle.tm["o" + key] = 1; return true; }
  return false;
}

        addSpike("bottom", battle.tm.side ? BOX.x + BOX.w + 12 : BOX.x - 12,
          14 + Math.random() * 12, 10, "multi", battle.tm.side ? -145 : 145);
      }
      if (every("bl", 1.9, 1)) {
        if (Math.random() < .5) addBlaster("h", clamp(soul.y, BOX.y + 10, BOX.y + BOX.h - 10));
        else addBlaster("v", clamp(soul.x, BOX.x + 12, BOX.x + BOX.w - 12));

function startRound(i) {

  jia.dx = 0;

  btext = null;
  bubble = tw(R.dlg, 24);
  setBp("rdlg");
}
function beginAttack() {
  const R = ROUNDS[battle.round - 1];
  spikes = []; blasters = [];
  battle.atkT = 0; battle.dur = R.dur; battle.tm = {};
  soul.x = BOX.x + BOX.w / 2; soul.y = BOX.y + BOX.h - 12;
  soul.vx = 0; soul.vy = 0;
  soul.mode = R.blue ? "blue" : "red";
  soul.gdir = "down";
  soul.inv = .9; soul.slam = false; soul.deadT = 0;

}
function endAttack() {
  spikes = []; blasters = [];
  soul.slam = false;
  if (battle.round >= 7) {

    setBp("notfin");

function damageSoul() {
  if (soul.inv > 0 || soul.deadT > 0) return;
  soul.hp -= 1;
  soul.inv = 1;
  shakeT = Math.max(shakeT, .18);
  if (soul.hp <= 0) soul.deadT = 1.4;
}

function updateAttack(dt) {
  if (soul.deadT > 0) {
    soul.deadT -= dt;
    if (soul.deadT <= 0) { soul.hp = soul.maxHp; soul.inv = 1.5; }
    return;
  }
  battle.atkT += dt;
  ROUNDS[battle.round - 1].update();

  /* spikes slide + grow */
  for (let i = spikes.length - 1; i >= 0; i--) {
    const s = spikes[i];
    s.len = Math.min(s.target, s.len + 95 * dt);
    s.pos += s.vel * dt;
    const horiz = s.edge === "bottom" || s.edge === "top";
    const lo = horiz ? BOX.x - 26 : BOX.y - 26;
    const hi = horiz ? BOX.x + BOX.w + 26 : BOX.y + BOX.h + 26;
    if (s.pos < lo || s.pos > hi) spikes.splice(i, 1);
  }
  for (let i = blasters.length - 1; i >= 0; i--) {
    blasters[i].t += dt;
    if (blasters[i].t > 1.25) blasters.splice(i, 1);
  }

  /* ----- soul control ----- */
  const L = BOX.x + 6, Rt = BOX.x + BOX.w - 6, T = BOX.y + 6, B = BOX.y + BOX.h - 6;
  const spd = 76;
  let ix = 0, iy = 0;
  if (left()) ix--; if (right()) ix++;
  if (up()) iy--; if (down()) iy++;
  const gd = soul.gdir;
  if (soul.mode === "red") {
    soul.vx = ix * spd; soul.vy = iy * spd;
  } else {
    const ga = 620 * (soul.slam ? 3.2 : 1);
    const grounded =
      (gd === "down" && soul.y >= B - .5) || (gd === "up" && soul.y <= T + .5) ||
      (gd === "left" && soul.x <= L + .5) || (gd === "right" && soul.x >= Rt - .5);
    const jHeld = keys.KeyZ || keys.Space || keys.Enter ||
      (gd === "down" && (keys.ArrowUp || keys.KeyW)) ||
      (gd === "up" && (keys.ArrowDown || keys.KeyS)) ||
      (gd === "left" && (keys.ArrowRight || keys.KeyD)) ||
      (gd === "right" && (keys.ArrowLeft || keys.KeyA));
    const jump = ((jHeld && !soul.pj) || zHit) && grounded && !soul.slam;
    soul.pj = jHeld;
    if (gd === "down" || gd === "up") {
      soul.vx = ix * spd;
      soul.vy += (gd === "down" ? 1 : -1) * ga * dt;
      if (jump) soul.vy = (gd === "down" ? -1 : 1) * 174;
      soul.vy = clamp(soul.vy, -265, 265);
    } else {
      soul.vy = iy * spd;
      soul.vx += (gd === "right" ? 1 : -1) * ga * dt;
      if (jump) soul.vx = (gd === "right" ? -1 : 1) * 174;
      soul.vx = clamp(soul.vx, -265, 265);
    }
  }
  zHit = false;                     /* Z belongs to the soul during attacks */
  soul.x += soul.vx * dt;
  soul.y += soul.vy * dt;
  const land = () => { if (soul.slam) { soul.slam = false; shakeT = Math.max(shakeT, .24); } };
  if (soul.x < L) { soul.x = L; if (soul.vx < 0) soul.vx = 0; if (gd === "left") land(); }
  if (soul.x > Rt) { soul.x = Rt; if (soul.vx > 0) soul.vx = 0; if (gd === "right") land(); }
  if (soul.y < T) { soul.y = T; if (soul.vy < 0) soul.vy = 0; if (gd === "up") land(); }
  if (soul.y > B) { soul.y = B; if (soul.vy > 0) soul.vy = 0; if (gd === "down") land(); }

  soul.inv = Math.max(0, soul.inv - dt);

  /* ----- collisions ----- */
  const speed = Math.hypot(soul.vx, soul.vy);
  const sb = { x: soul.x - 3, y: soul.y - 3, w: 6, h: 6 };
  const hitRect = r => sb.x < r.x + r.w && sb.x + sb.w > r.x && sb.y < r.y + r.h && sb.y + sb.h > r.y;
  for (const s of spikes) {
    if (s.len < 4) continue;
    const r = spikeRect(s);
    r.x += 1; r.y += 1; r.w = Math.max(1, r.w - 2); r.h = Math.max(1, r.h - 2);
    if (!hitRect(r)) continue;
    if (s.kind === "multi") damageSoul();
    else if (s.kind === "blue" && speed > 12) damageSoul();
    else if (s.kind === "orange" && speed < 12) damageSoul();
  }
  for (const b of blasters) {
    if (b.t > .55 && b.t < 1.0) {
      const r = blasterBeamRect(b);
      r.x += 2; r.y += 2; r.w -= 4; r.h -= 4;
      if (hitRect(r)) damageSoul();
    }
  }

  if (battle.atkT >= battle.dur) endAttack();
}

/* ----- drawing: string spikes / blaster / soul / hp ----- */
function spikeRect(s) {
  if (s.edge === "bottom") return { x: s.pos - s.w / 2, y: BOX.y + BOX.h - 2 - s.len, w: s.w, h: s.len };
  if (s.edge === "top")    return { x: s.pos - s.w / 2, y: BOX.y + 2, w: s.w, h: s.len };
  if (s.edge === "left")   return { x: BOX.x + 2, y: s.pos - s.w / 2, w: s.len, h: s.w };
  return { x: BOX.x + BOX.w - 2 - s.len, y: s.pos - s.w / 2, w: s.len, h: s.w };
}
function drawSpike(g, s, t) {
  if (s.len < 2) return;
  const pal = SPIKE_PALS[s.kind];
  const n = 6;
  g.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    g.strokeStyle = pal[i % pal.length];
    g.globalAlpha = .9;
    const f = i / (n - 1) - .5;
    const wob = Math.sin(t * 3 + s.ph + i) * 2;
    g.beginPath();
    if (s.edge === "bottom") {
      g.moveTo(s.pos + f * s.w, BOX.y + BOX.h - 2);
      g.quadraticCurveTo(s.pos + f * s.w * .4 + wob, BOX.y + BOX.h - 2 - s.len * .55, s.pos, BOX.y + BOX.h - 2 - s.len);
    } else if (s.edge === "top") {
      g.moveTo(s.pos + f * s.w, BOX.y + 2);
      g.quadraticCurveTo(s.pos + f * s.w * .4 + wob, BOX.y + 2 + s.len * .55, s.pos, BOX.y + 2 + s.len);
    } else if (s.edge === "left") {
      g.moveTo(BOX.x + 2, s.pos + f * s.w);
      g.quadraticCurveTo(BOX.x + 2 + s.len * .55, s.pos + f * s.w * .4 + wob, BOX.x + 2 + s.len, s.pos);
    } else {
      g.moveTo(BOX.x + BOX.w - 2, s.pos + f * s.w);
      g.quadraticCurveTo(BOX.x + BOX.w - 2 - s.len * .55, s.pos + f * s.w * .4 + wob, BOX.x + BOX.w - 2 - s.len, s.pos);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
}
function blasterBeamRect(b) {
  if (b.axis === "h") return { x: BOX.x + 2, y: b.at - 5, w: BOX.w - 4, h: 10 };
  return { x: b.at - 5, y: BOX.y + 2, w: 10, h: BOX.h - 4 };
}
function drawBlaster(g, b, t) {
  let sx, sy;
  if (b.axis === "h") { sx = BOX.x - 13; sy = b.at; }
  else { sx = b.at; sy = BOX.y - 13; }
  const charge = clamp(b.t / .55, 0, 1);
  const firing = b.t > .55 && b.t < 1.0;
  const fade = b.t >= 1.0 ? clamp((1.25 - b.t) / .25, 0, 1) : 1;
  if (firing) { if (b.axis === "h") sx -= 2; else sy -= 2; }
  /* aim line */
  if (!firing && b.t < .55) {
    const r = blasterBeamRect(b);
    g.fillStyle = `rgba(255,255,255,${.1 + charge * .12})`;
    if (b.axis === "h") g.fillRect(r.x, b.at - 1, r.w, 2);
    else g.fillRect(b.at - 1, r.y, 2, r.h);

  /* string beam */
  if (firing) {
    const r = blasterBeamRect(b);

    g.fillStyle = `rgba(255,255,255,${.85 * pulse})`;

        const xx2 = b.at + (i < 2 ? -6 - i : 4 + i);
        g.moveTo(xx2, r.y);

function drawJiahuiBattle(g, cx, cy, t, opts = {}) {
  /* monochrome anime battle sprite (~36x66) — only the eyes carry colour.

  const bob = Math.sin(t * 2.1) * 1.2;
  /* dodge keyframes: crouch -> side-step lean -> settle */
  const dg = opts.dodge ?? 0;
  let headDx = 0, bodyDx = 0, crouch = 0, stepK = 0;
  if (dg > 0 && dg < 1) {
    if (dg < .18) { crouch = 2 * (dg / .18); }
    else if (dg < .55) {
      const k = ease((dg - .18) / .37);
      crouch = 2 - k; headDx = 3 * k; bodyDx = 2 * k; stepK = k;
    } else {
      const k = ease((dg - .55) / .45);

    }

  const hxo = Math.round(headDx + bodyDx);

  g.fillRect(x + 20, y + 59, 8, 3);

  if (blink) {
    g.fillRect(x + 11 + hxo, by + 11, 5, 1);
    g.fillRect(x + 20 + hxo, by + 11, 5, 1);
  } else if (dim) {
    g.fillStyle = oc; g.fillRect(x + 13 + hxo, by + 10, 1, 1);
    g.fillStyle = bc; g.fillRect(x + 23 + hxo, by + 10, 1, 1);
  } else {
    const ey = by + 10 + (lidded ? 1 : 0);
    g.fillStyle = oc; g.fillRect(x + 12 + hxo + look, ey, 2, lidded ? 1 : 2);
    g.fillStyle = bc; g.fillRect(x + 22 + hxo + look, ey, 2, lidded ? 1 : 2);
    g.fillStyle = "#fff";
    g.fillRect(x + 12 + hxo + look, ey, 1, 1);
    g.fillRect(x + 22 + hxo + look, ey, 1, 1);
    const halo = face === "angry" ? .35 : .22;
    g.globalAlpha = (opts.alpha ?? 1) * halo;
    g.fillStyle = oc; g.fillRect(x + 11 + hxo, by + 9, 4, 4);
    g.fillStyle = bc; g.fillRect(x + 21 + hxo, by + 9, 4, 4);
    g.globalAlpha = opts.alpha ?? 1;
  }
  /* eye-bags + nose */
  g.fillStyle = SH;
  g.fillRect(x + 12 + hxo, by + 12, 2, 1); g.fillRect(x + 22 + hxo, by + 12, 2, 1);
  if (face === "tired") { g.fillRect(x + 12 + hxo, by + 13, 2, 1); g.fillRect(x + 22 + hxo, by + 13, 2, 1); }
  g.fillRect(x + 18 + hxo, by + 12, 1, 1);

  /* mouth — not a happy one */
  g.fillStyle = DARK;
  if (face === "smirk") {
    g.fillRect(x + 14 + hxo, by + 14, 8, 1);
    g.fillRect(x + 13 + hxo, by + 13, 1, 1); g.fillRect(x + 22 + hxo, by + 13, 1, 1);
  } else if (face === "angry") {
    g.fillRect(x + 14 + hxo, by + 13, 8, 3);
    g.fillStyle = "#eef1f6";
    g.fillRect(x + 15 + hxo, by + 14, 6, 1);
    g.fillStyle = DARK;
    g.fillRect(x + 16 + hxo, by + 14, 1, 1); g.fillRect(x + 19 + hxo, by + 14, 1, 1);
  } else if (face === "annoyed") {
    g.fillRect(x + 15 + hxo, by + 14, 5, 1);
    g.fillRect(x + 20 + hxo, by + 15, 1, 1);
  } else if (face === "empty") {
    g.fillRect(x + 16 + hxo, by + 14, 4, 1);
  } else {
    /* serious / cold / tired: flat line */
    g.fillRect(x + 15 + hxo, by + 14, 6, 1);
  }
  g.globalAlpha = 1;
}

/* white-outline silhouette version (intro) */
const silCvs = document.createElement("canvas");
silCvs.width = 64; silCvs.height = 76;
{
  const sg = silCvs.getContext("2d");
  drawJiahuiBattle(sg, 32, 72, .3);
  sg.globalCompositeOperation = "source-in";
  sg.fillStyle = "#fff";
  sg.fillRect(0, 0, 64, 76);
}
function drawOutline(g, cx, cy, t) {
  const x = cx - 32, y = cy - 72 + Math.sin(t * 1.6) * 1.5;
  for (const [ox, oy] of [[-1,0],[1,0],[0,-1],[0,1]]) g.drawImage(silCvs, x + ox, y + oy);
  g.save();
  g.globalCompositeOperation = "destination-out";
  g.drawImage(silCvs, x, y);
  g.restore();
}

/* crisp pixel border made of fill rects (no stroke fuzz) */
function rectBorder(g, x, y, w, h, th, color) {
  g.fillStyle = color;
  g.fillRect(x, y, w, th);
  g.fillRect(x, y + h - th, w, th);
  g.fillRect(x, y + th, th, h - th * 2);
  g.fillRect(x + w - th, y + th, th, h - th * 2);
}
/* hand-drawn 12x10 monochrome icons */
function drawBtnIcon(g, i, x, y, color) {
  g.fillStyle = color;
  if (i === 0) {            /* sword */
    g.fillRect(x + 4, y - 1, 2, 6);
    g.fillRect(x + 2, y + 5, 6, 1);
    g.fillRect(x + 4, y + 6, 2, 2);
    g.fillRect(x + 3, y + 8, 4, 1);
  } else if (i === 1) {     /* hand */
    g.fillRect(x + 2, y + 3, 6, 4);
    g.fillRect(x + 2, y + 1, 1, 2);
    g.fillRect(x + 4, y, 1, 3);
    g.fillRect(x + 6, y + 1, 1, 2);
    g.fillRect(x + 1, y + 4, 1, 2);
    g.fillRect(x + 3, y + 7, 4, 1);
  } else if (i === 2) {     /* bag */
    g.fillRect(x + 1, y + 3, 8, 6);
    g.fillRect(x + 3, y + 1, 1, 2);
    g.fillRect(x + 6, y + 1, 1, 2);
    g.fillRect(x + 3, y, 4, 1);
    g.fillStyle = "#000";
    g.fillRect(x + 4, y + 5, 2, 2);
  }
}

function drawBattleUI(g, t, glowStyle) {
  /* glowStyle: {a: alpha, volatile:bool, select:bool} */
  const vol = glowStyle.volatile;
  let a = glowStyle.a;
  if (vol) a = clamp(a + (Math.random() - .5) * .5, .18, 1);
  const col = vol ? `rgba(255,154,46,${a})` : `rgba(255,255,255,${a})`;
  const colDim = vol ? `rgba(255,154,46,${a * .35})` : `rgba(255,255,255,${a * .35})`;

  /* battle box: thick outer line + faint inner line */
  rectBorder(g, BOX.x, BOX.y, BOX.w, BOX.h, 2, col);
  rectBorder(g, BOX.x + 4, BOX.y + 4, BOX.w - 8, BOX.h - 8, 1, colDim);

  /* buttons */
  setFont(g, 8);
  for (let i = 0; i < 4; i++) {
    const bx = 12 + i * 76, by = 206, bw = 70, bh = 26;
    const sel = glowStyle.select && btnSel === i;
    const label = BTNS[i];
    if (sel) {
      /* inverted: white plate, black ink, red soul cursor */
      g.fillStyle = `rgba(255,255,255,${a})`;
      g.fillRect(bx, by - 1, bw, bh);
      g.fillStyle = "#101218";
      g.fillText(label, bx + (bw - label.length * 8) / 2 + 7, by + 8);
      drawHeart(g, bx + 5, by + 8, 1);
    } else {
      rectBorder(g, bx, by, bw, bh, 2, col);
      rectBorder(g, bx + 3, by + 3, bw - 6, bh - 6, 1, colDim);
      const tx = bx + (bw - (label.length * 8 + 12)) / 2 + 12;
      if (i === 3) {
        const prev = g.globalAlpha;
        g.globalAlpha = prev * a;
        drawHeart(g, tx - 12, by + 9, 1, vol ? "#ff9a2e" : "#ffffff");
        g.globalAlpha = prev;
      } else {
        drawBtnIcon(g, i, tx - 12, by + 9, col);
      }
      g.fillStyle = col;
      g.fillText(label, tx, by + 9);
    }
  }
}

function boxText(g, t) {
  if (!btext) return;
  setFont(g, 8);
  wrap(g, twText(btext), BOX.x + 10, BOX.y + 10, BOX.w - 20, 12, "#fff");
}

function drawBubble(g, t) {
  if (!bubble) return;
  const bx = 208, by = 30, bw = 102, bh = 54;
  g.fillStyle = "#fff"; g.fillRect(bx, by, bw, bh);
  g.fillStyle = "#fff";
  g.beginPath(); g.moveTo(bx, by + 26); g.lineTo(bx - 8, by + 30); g.lineTo(bx, by + 34); g.fill();
  setFont(g, 7);
  wrap(g, twText(bubble), bx + 5, by + 6, bw - 10, 10, "#000");
}

/* ==========================================================
   GAME STATE MACHINE
   ========================================================== */
let mode = "menu";
let mt = 0;
let flashHeart = null;   /* {x,y} screen pos */
let heartAnim = 0;
let stunT = 0;

function go(m) {
  mode = m; mt = 0;
  if (m === "story") { storyI = 0; storyT = 0; capTW = tw(SLIDES[0].cap, 24); }
  if (m === "bintro") {
    particles = [];
    for (let i = 0; i < 26; i++) particles.push({ x: 20 + Math.random() * 280, y: Math.random() * H, s: .35 + Math.random() * .5 });
  }
  if (m === "bmain") {
    bp = "volatile"; bpt = 0; btext = null; bubble = null; btnSel = 0;
    jia.dx = 0; jia.reveal = 0; jia.face = "serious";
    battle.round = 0; battle.tm = {};
    soul.hp = soul.maxHp; soul.mode = "red"; soul.gdir = "down";
    spikes = []; blasters = []; shakeT = 0;
  }
}

function setBp(p) { bp = p; bpt = 0; bpFlags = {}; }

/* ---------------- main loop ---------------- */
let last = performance.now();
let gt = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 1 / 20);
  last = now;
  gt += dt; mt += dt;
  const g = ctx;
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  g.imageSmoothingEnabled = false;
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);

  switch (mode) {
    /* ============ MENU ============ */
    case "menu": {
      updateWorld(dt, false);
      drawWorld(g, gt);
      g.fillStyle = "rgba(2,4,14,.78)"; g.fillRect(0, 0, W, H);
      setFont(g, 22);
      g.fillStyle = "#fff";
      g.fillText("MY SANS", 74, 58);
      setFont(g, 10);
      g.fillStyle = "#8fb4ff";
      g.fillText("J I A H U I", 106, 92);
      setFont(g, 7);
      g.fillStyle = "#aab6d8";
      g.fillText("an undertale-style pixel story", 56, 120);
      g.fillText("arrows / wasd move · Z confirm · X skip", 34, 150);
      drawHeart(g, 151, 170, 2);
      if (Math.floor(gt * 2) % 2) {
        setFont(g, 8);
        g.fillStyle = "#fff";
        g.fillText("PRESS Z TO START", 96, 200);
      }
      setFont(g, 6);
      g.fillStyle = "#5a6488";
      g.fillText("fan-made · every pixel original · no sound (yet)", 30, 226);
      if (zHit) { zHit = false; go("walk"); }
      break;
    }

    /* ============ OVERWORLD ============ */
    case "walk": {
      updateWorld(dt, !dlg);
      updateDlg(dt);
      const d = Math.hypot(player.x - npc.x, player.y - npc.y);
      if (!dlg) {
        if (!met1 && d < 90) {
          met1 = true;
          stunT = .8;
          go("stun");
        } else if (met1 && !met2 && d < 46) {
          met2 = true;
          go("lock");
        }
      }
      drawWorld(g, gt);
      drawDlg(g, gt);
      break;
    }
    case "stun": {
      updateWorld(dt, false);
      drawWorld(g, gt);
      /* stun stars + "!" */
      const sx = player.x - camX + 7, sy = player.y - 40;
      g.fillStyle = "#ffe93a";
      setFont(g, 10);
      if (Math.floor(gt * 6) % 2) g.fillText("!", sx - 2, sy - 6);
      for (let i = 0; i < 3; i++) {
        const a = gt * 6 + i * 2.1;
        g.fillRect(sx + Math.cos(a) * 8, sy + 4 + Math.sin(a) * 3, 2, 2);
      }
      if (mt > .8) {
        openDlg([{ head: "calm", text: "Uhmmm? Come close?" }], () => {});
        go("walk");
      }
      break;
    }
    case "lock": {
      updateWorld(dt, false);
      npc.glow = clamp(npc.glow + (mt > 1.2 ? dt * 2 : 0), 0, 1);
      if (mt < .1 && !dlg) {
        openDlg([
          { head: "calm", text: "..." },
          { head: "serious", text: "so you really came all the way here." },
          { head: "glow", text: "LET GO AHEAD" },
        ], () => go("flashes"));
      }
      updateDlg(dt);
      drawWorld(g, gt);
      /* eye glow world spark */
      drawDlg(g, gt);
      break;
    }
    case "flashes": {
      updateWorld(dt, false);
      npc.glow = 1;
      drawWorld(g, gt);
      /* two black flashes; heart appears on 2nd */
      const t2 = mt;
      let black = false;
      if (t2 > .35 && t2 < .58) black = true;
      if (t2 > .82) black = true;
      if (black) { g.fillStyle = "#000"; g.fillRect(0, 0, W, H); }
      if (t2 > 1.02) {
        if (!flashHeart) flashHeart = { x: player.x - camX + 1, y: player.y - 16 };
        drawHeart(g, flashHeart.x, flashHeart.y, 1.6);
      }
      if (t2 > 1.55) { go("heartMove"); heartAnim = 0; }
      break;
    }
    case "heartMove": {
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      heartAnim += dt;
      const p = ease(clamp(heartAnim / 1.15, 0, 1));
      const hx = lerp(flashHeart.x, 152, p), hy = lerp(flashHeart.y, 111, p);
      let show = true;
      if (heartAnim > 1.55) show = Math.floor((heartAnim - 1.55) * 9) % 2 === 0;
      if (heartAnim > 2.15) show = false;
      if (show) drawHeart(g, hx, hy, 1.6 + p * .6);
      if (heartAnim > 2.7) go("whiteout");
      break;
    }
    case "whiteout": {
      const p = clamp(mt / 1.6, 0, 1);
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      g.fillStyle = `rgba(255,255,255,${p})`;
      g.fillRect(0, 0, W, H);
      if (mt > 2.1) go("story");
      break;
    }

    /* ============ STORY ============ */
    case "story": {
      storyT += dt;
      const S = SLIDES[storyI];
      twUpdate(capTW, dt);
      if (xHit) twSkip(capTW);
      frameArt(g);
      if (S.shake) {
        g.save();
        g.translate((Math.random() - .5) * 2.5, (Math.random() - .5) * 2.5);
      }
      artClip(g, S.art, storyT);
      if (S.shake) g.restore();
      setFont(g, 8);
      wrap(g, twText(capTW), 34, 166, 252, 13, "#ecd49a");
      if (capTW.done && Math.floor(gt * 2.5) % 2) {
        g.fillStyle = "#ecd49a"; g.fillText("▼", 296, 224);
      }
      const advance = (capTW.done && storyT > capTW.text.length / 24 + 2.6) || (zHit && capTW.done);
      if (zHit && !capTW.done) { twSkip(capTW); zHit = false; }
      if (advance) {
        zHit = false;
        storyI++;
        if (storyI >= SLIDES.length) go("wflash");
        else { storyT = 0; capTW = tw(SLIDES[storyI].cap, 24); }
      }
      break;
    }
    case "wflash": {
      /* screen slowly flashes white, then battle */
      const p = clamp(mt / 2.2, 0, 1);
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      const pulse = Math.sin(mt * 6) * .5 + .5;
      g.fillStyle = `rgba(255,255,255,${p * (0.55 + pulse * .45)})`;
      g.fillRect(0, 0, W, H);
      if (mt > 2.6) go("bintro");
      break;
    }

    /* ============ BATTLE INTRO (outline, breathing UI) ============ */
    case "bintro": {
      /* white particles drifting up */
      for (const pa of particles) {
        pa.y -= pa.s * 26 * dt;
        if (pa.y < -4) { pa.y = H + 4; pa.x = 20 + Math.random() * 280; }
      }
      const breathe = (Math.sin(mt * 2.1) + 1) / 2;
      drawBattleUI(g, gt, { a: .25 + breathe * .45, volatile: false, select: false });
      drawOutline(g, 160, 122, mt);
      drawHeart(g, 153, 153, 1.6);
      g.fillStyle = "rgba(255,255,255,.65)";
      for (const pa of particles) g.fillRect(pa.x, pa.y, pa.s > .6 ? 2 : 1, pa.s > .6 ? 2 : 1);
      if (mt > 6) go("placeholder");
      break;
    }
    case "placeholder": {
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      setFont(g, 8);
      const msg = "AUTHOR HAVENT DO ANIMATION";
      const shown = msg.slice(0, Math.floor(mt * 24));
      g.fillStyle = "#c8c8c8";
      g.fillText(shown, (W - msg.length * 8) / 2 + 4, 114);
      if (mt > 2.9) go("bmain");
      break;
    }

    /* ============ BATTLE MAIN ============ */
    case "bmain": {
      bpt += dt;
      /* embers rise once volatile */
      if (particles.length < 46 && Math.random() < dt * 9)
        particles.push({ x: 20 + Math.random() * 280, y: H + 3, s: .4 + Math.random() * .6, o: true });
      for (let i = particles.length - 1; i >= 0; i--) {
        const pa = particles[i];
        pa.y -= pa.s * 30 * dt;
        if (pa.y < -4) particles.splice(i, 1);
      }

      /* phase logic */
      if (bp === "volatile" && bpt > 1.3) {
        setBp("sentence");
        btext = tw("* It smells like rain and old memories. Something is blocking the path.", 26);
      } else if (bp === "sentence") {
        twUpdate(btext, dt);
        if (xHit) twSkip(btext);
        if (btext.done && (bpt > btext.text.length / 26 + 1.2 || zHit)) { zHit = false; setBp("reveal"); }
      } else if (bp === "reveal") {
        jia.reveal = clamp(jia.reveal + dt / 1.2, 0, 1);
        if (jia.reveal >= 1 && bpt > 1.6) {
          setBp("pturn");
          btext = tw("* JIAHUI blocks the way.", 30);
        }
      } else if (bp === "rdlg") {
        twUpdate(bubble, dt);
        if (xHit) twSkip(bubble);
        if (bubble && bubble.done && (zHit || bpt > bubble.text.length / 24 + 1.8)) {
          zHit = false;
          bubble = null;
          beginAttack();
        }
      } else if (bp === "attack") {
        updateAttack(dt);
      } else if (bp === "acted") {
        twUpdate(btext, dt);
        if (btext && btext.done && bpt > btext.text.length / 30 + 1.4)
          startRound(battle.round + 1);
      } else if (bp === "pturn") {
        twUpdate(btext, dt);
        if (keys.ArrowLeft && !bpFlags.l) { btnSel = (btnSel + 3) % 4; bpFlags.l = 1; }
        if (!keys.ArrowLeft) bpFlags.l = 0;
        if (keys.ArrowRight && !bpFlags.r) { btnSel = (btnSel + 1) % 4; bpFlags.r = 1; }
        if (!keys.ArrowRight) bpFlags.r = 0;
        if (zHit) {
          zHit = false;
          if (btnSel === 0) { setBp("aim"); missT = -1; }
          else {
            const lines = [null,
              "* you try to say something. the rain is louder.",
              "* your pockets are empty.",
              "* he shakes his head, slowly."];
            btext = tw(lines[btnSel], 30);
            setBp(battle.round === 0 ? "acted0" : "acted");
          }
        }
      } else if (bp === "acted0") {
        twUpdate(btext, dt);
        if (btext.done && bpt > 1.6) {
          setBp("pturn");
          btext = tw("* JIAHUI blocks the way.", 30);
        }
      } else if (bp === "aim") {
        if (zHit) {
          zHit = false;
          setBp("strike");
          slashT = 0;
        }
      } else if (bp === "strike") {
        slashT += dt;
        if (slashT > .22 && !bpFlags.dodged) {
          bpFlags.dodged = 1;
          missT = 0;
        }
        if (missT >= 0) {
          missT += dt;
          /* anticipation crouch first, then the side-step slide */
          if (missT > .12) jia.dx = lerp(jia.dx, 40, dt * 10);
          if (Math.random() < dt * 24 && jia.dx < 34)
            jia.ghosts.push({ dx: jia.dx, t: .3, dg: clamp(missT / .9, 0, 1) });
        }
        if (slashT > 1.15) {
          if (battle.round === 0) {
            setBp("hisline");
            bubble = tw("heh... quick one. but i've watched that exact move for six years.", 24);
            jia.face = "serious";
          } else {
            startRound(battle.round + 1);
          }
        }
      } else if (bp === "hisline") {
        twUpdate(bubble, dt);
        if (xHit) twSkip(bubble);
        if (bubble.done && (zHit || bpt > bubble.text.length / 24 + 2)) {
          zHit = false;
          bubble = null;
          startRound(1);
        }
      } else if (bp === "notfin") {
        twUpdate(btext, dt);
        if (btext.done && bpt > btext.text.length / 18 + 2.4) go("end");
      }
      for (const gh of jia.ghosts) gh.t -= dt;
      jia.ghosts = jia.ghosts.filter(gh => gh.t > 0);

      /* ---- draw ---- */
      g.save();
      if (shakeT > 0) {
        shakeT -= dt;
        g.translate(Math.round((Math.random() - .5) * 4), Math.round((Math.random() - .5) * 4));
      }
      const inAttack = bp === "attack";
      const uiSelect = bp === "pturn";
      drawBattleUI(g, gt, {
        a: inAttack || bp === "rdlg" ? .5 : .8,
        volatile: bp === "volatile" || bp === "sentence",
        select: uiSelect,
      });

      /* jiahui */
      const dgP = (bp === "strike" && missT >= 0) ? clamp(missT / .9, 0, 1) : 0;
      if (bp === "volatile" || bp === "sentence") {
        drawOutline(g, 160, 122, mt);
      } else {
        for (const gh of jia.ghosts)
          drawJiahuiBattle(g, 160, 122, gt, { dx: gh.dx, alpha: gh.t / .3 * .4, dodge: gh.dg ?? 0, face: jia.face });
        if (bp === "reveal") {
          /* scanline reveal */
          g.save();
          g.beginPath();
          g.rect(100, 122 - 72, 120, 72 * jia.reveal);
          g.clip();
          drawJiahuiBattle(g, 160, 122, gt, { face: jia.face });
          g.restore();
          g.fillStyle = "rgba(255,255,255,.8)";
          g.fillRect(100, 122 - 72 + 72 * jia.reveal, 120, 1);
        } else {
          drawJiahuiBattle(g, 160, 122, gt, { dx: jia.dx, dodge: dgP, face: jia.face });
        }
      }

      /* slash fx */
      if (bp === "strike" && slashT < .3) {
        const sp = slashT / .3;
        g.strokeStyle = `rgba(255,255,255,${1 - sp})`;
        g.lineWidth = 3;
        g.beginPath();
        g.moveTo(140 - sp * 8, 70 + sp * 40);
        g.lineTo(175 + sp * 6, 105 + sp * 40);
        g.stroke();
        g.strokeStyle = `rgba(160,170,190,${(1 - sp) * .7})`;
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(146 - sp * 8, 66 + sp * 40);
        g.lineTo(181 + sp * 6, 101 + sp * 40);
        g.stroke();
      }
      if (missT >= 0 && missT < 1) {
        setFont(g, 9);
        g.fillStyle = `rgba(200,200,200,${1 - missT})`;
        g.fillText("MISS", 146, 60 - missT * 14);
      }

      /* aim board — monochrome target bar */
      if (bp === "aim") {
        g.fillStyle = "#000";
        g.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4);
        rectBorder(g, BOX.x + 5, BOX.y + 5, BOX.w - 10, BOX.h - 10, 1, "#3a3f4c");
        /* ruler ticks */
        g.fillStyle = "#3a3f4c";
        for (let tx2 = BOX.x + 10; tx2 < BOX.x + BOX.w - 10; tx2 += 12) {
          g.fillRect(tx2, BOX.y + 7, 1, 3);
          g.fillRect(tx2, BOX.y + BOX.h - 10, 1, 3);
        }
        /* centre target zone + chevrons */
        const tcx = BOX.x + BOX.w / 2;
        g.fillStyle = "rgba(255,255,255,.14)";
        g.fillRect(tcx - 8, BOX.y + 7, 16, BOX.h - 14);
        g.fillStyle = "rgba(255,255,255,.3)";
        g.fillRect(tcx - 8, BOX.y + 7, 1, BOX.h - 14);
        g.fillRect(tcx + 7, BOX.y + 7, 1, BOX.h - 14);
        g.fillStyle = "#fff";
        g.fillRect(tcx - 1, BOX.y + 7, 2, BOX.h - 14);
        g.fillRect(tcx - 4, BOX.y + 3, 8, 2);
        g.fillRect(tcx - 2, BOX.y + 5, 4, 1);
        g.fillRect(tcx - 4, BOX.y + BOX.h - 5, 8, 2);
        g.fillRect(tcx - 2, BOX.y + BOX.h - 6, 4, 1);
        /* sweeping cursor with a fading trail */
        const span = BOX.w - 20;
        const sweep = (bpt * 190) % (span * 2);
        const sx2 = BOX.x + 10 + (sweep < span ? sweep : span * 2 - sweep);
        const dir2 = sweep < span ? 1 : -1;
        for (let k2 = 1; k2 <= 4; k2++) {
          g.fillStyle = `rgba(255,255,255,${.3 - k2 * .06})`;
          g.fillRect(sx2 - dir2 * k2 * 3 - 1, BOX.y + 8, 2, BOX.h - 16);
        }
        g.fillStyle = "#fff";
        g.fillRect(sx2 - 1, BOX.y + 6, 3, BOX.h - 12);
        setFont(g, 7);
        if (Math.floor(gt * 3) % 2) {
          g.fillStyle = "#9aa2b0";
          g.fillText("PRESS Z", BOX.x + BOX.w - 64, BOX.y + BOX.h - 14);
        }
      } else if (inAttack) {
        drawAttack(g);
      } else if (bp !== "volatile") {
        boxText(g, gt);
      }
      /* strike flash on the box frame */
      if (bp === "strike" && slashT < .1) {
        rectBorder(g, BOX.x, BOX.y, BOX.w, BOX.h, 2, `rgba(255,255,255,${1 - slashT * 8}`);
      }
      /* soul in box during menu phases */
      if (bp === "pturn") drawHeart(g, 62, BOX.y + BOX.h - 16, 1.2);
      /* player hp during the rounds */
      if (battle.round > 0 && (inAttack || bp === "pturn" || bp === "aim" || bp === "strike" || bp === "acted" || bp === "rdlg"))
        drawHpBar(g);

      drawBubble(g, gt);

      /* particles (kept monochrome; orange only while the UI is volatile) */
      for (const pa of particles) {
        const orange = pa.o && (bp === "volatile" || bp === "sentence");
        g.fillStyle = orange ? "rgba(255,154,46,.4)" : "rgba(225,232,245,.38)";
        g.fillRect(pa.x, pa.y, pa.s > .6 ? 2 : 1, pa.s > .6 ? 2 : 1);
      }
      g.restore();
      break;
    }

    /* ============ END ============ */
    case "end": {
      const p = clamp(mt / 1.4, 0, 1);
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      g.globalAlpha = p;
      drawHeart(g, 147, 58, 3);
      setFont(g, 14);
      g.fillStyle = "#fff";
      g.fillText("MY SANS", 104, 100);
      setFont(g, 8);
      g.fillStyle = "#8fb4ff";
      g.fillText("J I A H U I", 124, 126);
      setFont(g, 7);
      g.fillStyle = "#aab6d8";
      g.fillText("chapter zero · to be continued", 62, 152);
      g.fillStyle = "#5a6488";
      g.fillText("this things is not finished", 74, 172);
      if (Math.floor(gt * 2) % 2) {
        g.fillStyle = "#fff";
        g.fillText("press R to restart", 96, 206);
      }
      g.globalAlpha = 1;
      break;
    }
  }

  zHit = false; xHit = false;
}
requestAnimationFrame(loop);

/* ---------------- test hooks ---------------- */
window.__ms = {
  get mode() { return mode; },
  get bp() { return bp; },
  get storyI() { return storyI; },
  get dlgOpen() { return !!dlg; },
  get battle() { return battle; },
  get soul() { return soul; },
  get spikeCount() { return spikes.length; },
  get blasterCount() { return blasters.length; },
  get jiaFace() { return jia.face; },
  player, npc,
  start() { if (mode === "menu") go("walk"); },
  near(dist) { player.x = npc.x - dist; player.y = npc.y; },
  slide(i) { if (mode === "story") { storyI = i; storyT = 0; capTW = tw(SLIDES[i].cap, 24); } },
  jump(m) { go(m); },
  setMet(a, b) { met1 = a; met2 = b; },
  toRound(i) {
    if (mode !== "bmain") go("bmain");
    jia.reveal = 1;
    startRound(i);
  },
  skipAttack() { if (bp === "attack") battle.atkT = battle.dur - .05; },
  hurtSoul() { soul.inv = 0; damageSoul(); },
  setHp(n) { soul.hp = n; },
};
</script>
