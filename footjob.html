<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Anime Footjob — Overstimulate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --bg: #1a1020;
    --panel: rgba(28, 14, 32, 0.55);
    --line: rgba(255, 140, 190, 0.22);
    --text: #ffeaf2;
    --muted: #c49aaf;
    --accent: #ff8ec8;
    --hot: #ff4d8d;
    --over: #ffe066;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
    touch-action: none;
  }
  canvas#view { display: block; width: 100%; height: 100%; }
  #ui {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    /* keep center clear — chrome only hugs edges */
  }
  .chip, .dock, .stats {
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(20, 0, 16, .35);
  }
  /* minimal title — no long blurb */
  #title {
    position: absolute; left: 12px; top: 12px;
    padding: 7px 12px;
    max-width: min(240px, 55vw);
  }
  #title h1 {
    font-size: 12px; font-weight: 800; letter-spacing: 0.05em;
    background: linear-gradient(90deg, #ff9ad5, #ffd6ea, #ffe08a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* compact stats — top right, narrow */
  #telemetry {
    position: absolute; right: 12px; top: 12px;
    width: 148px;
    padding: 8px 10px;
    font-family: "IBM Plex Mono", monospace; font-size: 10px;
    transition: opacity .2s, transform .2s;
  }
  #telemetry.hidden { opacity: 0; pointer-events: none; transform: translateY(-6px); }
  #telemetry .h {
    color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 4px; font-size: 9px; font-family: "M PLUS Rounded 1c", sans-serif;
    display: flex; justify-content: space-between; align-items: center;
  }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; color: var(--muted); }
  .row b { color: var(--text); font-weight: 500; }

  /* slim bottom dock — doesn't cover the action */
  #controls {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    width: min(420px, calc(100vw - 16px));
    padding: 8px 10px 9px;
  }
  .dock-top {
    display: flex; align-items: center; gap: 8px;
  }
  .meters {
    flex: 1; min-width: 0;
    display: grid; gap: 4px;
  }
  .meter-label {
    display: flex; justify-content: space-between;
    font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); line-height: 1;
  }
  .meter {
    height: 6px; border-radius: 999px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .meter > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff9ad5, #ff4d8d 55%, #ffe066);
  }
  .meter.sense > i {
    background: linear-gradient(90deg, #ffe066, #ff4d8d, #ff9ad5);
  }
  .dock-actions {
    display: flex; flex-shrink: 0; gap: 4px;
  }
  button, .icon-btn {
    appearance: none; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: var(--text);
    border-radius: 999px; padding: 6px 10px;
    font: 700 11px/1 "M PLUS Rounded 1c", sans-serif;
    letter-spacing: 0.03em; cursor: pointer; pointer-events: auto;
  }
  .icon-btn {
    width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center; font-size: 13px;
    border-radius: 8px;
  }
  button:hover, .icon-btn:hover { background: rgba(255,255,255,.12); }
  button.active { border-color: var(--accent); color: var(--accent); }
  button#overstim.active {
    border-color: var(--over); color: var(--over);
    background: rgba(255, 224, 102, .12);
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,224,102,.15); }
    50% { box-shadow: 0 0 16px rgba(255,77,141,.4); }
  }
  .btns {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 7px;
  }
  .btns button { flex: 1 1 auto; min-width: 0; padding: 7px 8px; font-size: 11px; }

  /* sliders live in a drawer — closed by default so view stays open */
  #more {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  #controls.open #more { display: block; }
  #controls.open #toggleMore { color: var(--accent); border-color: var(--accent); }
  .sliders {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
  }
  .sliders label {
    display: grid; gap: 2px; font-size: 9px; color: var(--muted);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 16px; }

  #hint {
    margin-top: 6px; text-align: center;
    font-size: 10px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #hint.hot { color: var(--hot); font-weight: 700; }

  /* corner toggles — top-right under title row, away from the action */
  #chromeToggles {
    position: absolute; right: 12px; top: 12px;
    display: flex; gap: 4px; pointer-events: auto;
    z-index: 6;
  }
  #telemetry { top: 48px; } /* sit below toggles when shown */
  body.ui-hidden #title,
  body.ui-hidden #telemetry,
  body.ui-hidden #controls,
  body.ui-hidden #storyBtn { opacity: 0; pointer-events: none; }
  body.ui-hidden #chromeToggles #toggleStats { opacity: 0.35; }

  /* Story button — right side, mid */
  #storyBtn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    pointer-events: auto;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 0.18em;
    padding: 14px 10px;
    font: 800 13px/1 "M PLUS Rounded 1c", sans-serif;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--accent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(20, 0, 16, .35);
  }
  #storyBtn:hover { background: rgba(255,255,255,.1); color: #ffe066; }
  #storyBtn.active {
    color: #ffe066; border-color: #ffe066;
    box-shadow: 0 0 18px rgba(255, 224, 102, .25);
  }
  body.story-playing #controls { opacity: 0.35; pointer-events: none; }
  body.story-playing #controls.story-live { opacity: 1; pointer-events: auto; }

  /* Dialogue box — bottom, above dock, doesn't cover center */
  #dialogue {
    position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%);
    width: min(520px, calc(100vw - 24px));
    pointer-events: auto;
    display: none;
    padding: 10px 14px 12px;
    background: rgba(20, 10, 24, 0.78);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 32px rgba(0,0,0,.4);
  }
  #dialogue.show { display: block; }
  #dialogue .who {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px; font-weight: 800;
  }
  #dialogue .who.boy { color: #9ec8ff; }
  #dialogue .who.narr { color: var(--muted); }
  #dialogue .line {
    font-size: 14px; line-height: 1.45; min-height: 1.45em;
    color: var(--text);
  }
  #dialogue .next {
    margin-top: 8px; font-size: 10px; color: var(--muted);
    text-align: right; letter-spacing: 0.06em;
  }
  body.ui-hidden #dialogue { opacity: 0; pointer-events: none; }

  #fx {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    opacity: 0; transition: opacity .15s;
    background:
      radial-gradient(circle at 50% 55%, rgba(255,120,180,.28), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255,230,120,.15), transparent 40%);
  }
  #fx.on { opacity: 1; }
  #fx.over {
    opacity: 1;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,80,140,.35), transparent 50%),
      radial-gradient(circle at 30% 40%, rgba(255,220,100,.18), transparent 35%),
      radial-gradient(circle at 70% 60%, rgba(255,150,220,.22), transparent 40%);
  }
  #burst {
    position: fixed; left: 50%; top: 18%; transform: translate(-50%,-50%) scale(.8);
    pointer-events: none; z-index: 6; opacity: 0;
    font: 800 32px/1 "M PLUS Rounded 1c", sans-serif;
    letter-spacing: 0.08em; color: #ffe066;
    text-shadow: 0 0 16px rgba(255,80,140,.7), 0 3px 0 #ff4d8d;
    transition: opacity .2s, transform .2s;
  }
  #burst.show { opacity: 1; transform: translate(-50%,-50%) scale(1.05); }
  #hearts {
    position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden;
  }
  .heart {
    position: absolute; font-size: 16px; opacity: 0.9;
    animation: floatHeart 1.4s ease-out forwards;
  }
  @keyframes floatHeart {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
  }
  #load {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #1a1020; font-size: 14px; color: var(--muted); letter-spacing: 0.08em;
  }
  #load.hide { opacity: 0; pointer-events: none; transition: opacity .4s; }
  @media (max-width: 700px) {
    #telemetry { display: none !important; }
    #chromeToggles #toggleStats { display: none; }
    .sliders { grid-template-columns: 1fr; }
    #burst { font-size: 22px; top: 14%; }
    #controls { bottom: 8px; width: calc(100vw - 12px); }
    #hint { display: none; }
    #storyBtn {
      top: auto; bottom: 72px; transform: none;
      writing-mode: horizontal-tb;
      letter-spacing: 0.1em;
      padding: 8px 12px;
    }
    #dialogue { bottom: 110px; font-size: 13px; }
  }
</style>
</head>

<div id="load">Loading anime footjob…</div>
<canvas id="view"></canvas>

<script>
// Failsafe: never leave the user stuck on the loader
window.addEventListener("error", (e) => {
  const el = document.getElementById("load");
  if (el) el.textContent = "Load error — " + (e.message || "check console");
});
window.addEventListener("unhandledrejection", (e) => {
  const el = document.getElementById("load");
  const reason = e.reason?.message || String(e.reason || "import failed");
  if (el) el.textContent = "Load error — " + reason;
});
setTimeout(() => {
  const el = document.getElementById("load");
  if (el && !el.classList.contains("hide")) {
    el.textContent = "Still loading… if this persists, allow cdn.jsdelivr.net";
  }
}, 8000);
</script>

function drawAnimeEye(ctx, cx, cy, flip, emo = EMOTIONS.neutral) {
  ctx.save();
  ctx.translate(cx, cy);
  if (flip) ctx.scale(-1, 1);
  const lookX = (emo.lookX || 0) * (flip ? -1 : 1);
  const lookY = emo.lookY || 0;
  const open = emo.eyeOpen ?? 1;

    ctx.beginPath();
    ctx.moveTo(-48, 4);
    ctx.quadraticCurveTo(0, -28 * open, 48, 4);
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1a1020";
    ctx.stroke();
    ctx.restore();
    return;

  ctx.beginPath();
  ctx.moveTo(-52, -4);
  ctx.bezierCurveTo(-40, -18 - h * 0.9, 42, -18 - h * 0.9, 52, -6);
  ctx.bezierCurveTo(44, h * 1.1, -40, h * 1.15, -52, -4);
  ctx.closePath();
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = "#1a1020";
  ctx.stroke();

  // upper lash
  ctx.beginPath();
  ctx.moveTo(-54, -6);
  ctx.bezierCurveTo(-38, -22 - h, 44, -22 - h, 56, -8);
  ctx.bezierCurveTo(40, -10 - h * 0.35, -36, -8 - h * 0.3, -54, -6);
  ctx.closePath();
  ctx.fillStyle = "#1a1020";
  ctx.fill();

  // wing lash
  ctx.beginPath();
  ctx.moveTo(48, -12);
  ctx.quadraticCurveTo(72, -18, 82, -4);
  ctx.quadraticCurveTo(68, -10, 52, 0);
  ctx.closePath();
  ctx.fill();

  // iris
  const ix = lookX * 40, iy = 6 + lookY * 30;
  if (emo.heart) {
    ctx.fillStyle = "#ff5a9a";
    ctx.beginPath();
    const s = 22;
    ctx.moveTo(ix, iy + s * 0.35);
    ctx.bezierCurveTo(ix - s, iy - s * 0.2, ix - s * 0.6, iy - s, ix, iy - s * 0.45);
    ctx.bezierCurveTo(ix + s * 0.6, iy - s, ix + s, iy - s * 0.2, ix, iy + s * 0.35);
    ctx.fill();
  } else {
    const ig = ctx.createRadialGradient(ix - 4, iy - 4, 4, ix, iy, 38);
    ig.addColorStop(0, "#e8d4ff");
    ig.addColorStop(0.3, "#a78bfa");
    ig.addColorStop(0.7, "#6d28d9");
    ig.addColorStop(1, "#2e1065");
    ctx.beginPath();
    ctx.ellipse(ix, iy, 34, 36 * Math.min(1, open), 0, 0, Math.PI * 2);
    ctx.fillStyle = ig;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#1a1020";
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(ix, iy + 4, 12, 16 * Math.min(1, open), 0, 0, Math.PI * 2);
    ctx.fillStyle = "#0f0618";
    ctx.fill();
  }

  if (emo.sparkle !== false) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(ix - 12, iy - 12, 10, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ix + 12, iy + 12, 5, 0, Math.PI * 2); ctx.fill();
  }

  // brow
  const browY = -52 - (emo.brow || 0) * 20;
  ctx.beginPath();
  ctx.moveTo(-40, browY + 8);
  ctx.quadraticCurveTo(0, browY - 10 + (emo.brow || 0) * 25, 42, browY + 2);
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1a1020";
  ctx.stroke();

  ctx.restore();
}

function drawMouth(ctx, w, h, kind = "soft") {
  ctx.clearRect(0, 0, w, h);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const cx = w / 2, cy = h / 2;
  ctx.strokeStyle = "#2a1520";
  ctx.fillStyle = "#2a1520";
  if (kind === "o") {
    ctx.beginPath();
    ctx.ellipse(cx, cy + 2, 10, 12, 0, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = "#4a2030";
    ctx.fill();
  } else if (kind === "smile") {
    ctx.beginPath();
    ctx.moveTo(cx - 22, cy - 2);
    ctx.quadraticCurveTo(cx, cy + 18, cx + 22, cy - 2);
    ctx.lineWidth = 5;
    ctx.stroke();
  } else if (kind === "smirk") {
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy + 2);
    ctx.quadraticCurveTo(cx + 4, cy + 14, cx + 24, cy - 6);
    ctx.lineWidth = 5;
    ctx.stroke();
  } else if (kind === "open" || kind === "talk") {
    ctx.beginPath();
    ctx.ellipse(cx, cy + 2, 14, kind === "talk" ? 10 : 13, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#5a2438";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.stroke();
  } else if (kind === "tongue") {
    ctx.beginPath();
    ctx.moveTo(cx - 18, cy - 2);
    ctx.quadraticCurveTo(cx, cy + 10, cx + 18, cy - 2);
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx + 4, cy + 10, 8, 6, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = "#ff7a9a";
    ctx.fill();
  } else if (kind === "small") {
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy);
    ctx.quadraticCurveTo(cx, cy + 6, cx + 10, cy);
    ctx.lineWidth = 4;
    ctx.stroke();
  } else if (kind === "line") {
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy);
    ctx.lineTo(cx + 12, cy);
    ctx.lineWidth = 4;
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - 18, cy);
    ctx.quadraticCurveTo(cx, cy + 10, cx + 18, cy);
    ctx.lineWidth = 5;
    ctx.stroke();
  }
}

function makeAnimeHead() {
  const g = new THREE.Group();

  const head = mesh(new THREE.SphereGeometry(0.118, 32, 24), skinF);
  head.scale.set(0.92, 1.08, 0.88);
  g.add(head);
  const chin = mesh(new THREE.SphereGeometry(0.055, 20, 14), skinF);
  chin.position.set(0, -0.095, 0.015);
  chin.scale.set(0.75, 0.7, 0.7);
  g.add(chin);
  const jaw = mesh(new THREE.SphereGeometry(0.07, 20, 14), skinF);
  jaw.position.set(0, -0.07, 0.01);
  jaw.scale.set(0.88, 0.55, 0.8);
  g.add(jaw);

  const eyes = [];
  const eyeCanvases = [];
  for (const sx of [-1, 1]) {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    eyeCanvases.push({ c, ctx: c.getContext("2d"), flip: sx < 0, sx });
    const eyeTex = new THREE.CanvasTexture(c);
    eyeTex.colorSpace = THREE.SRGBColorSpace;
    eyeTex.needsUpdate = true;
    const eyeMat = new THREE.MeshBasicMaterial({
      map: eyeTex, transparent: true, depthTest: false, depthWrite: false,
      side: THREE.FrontSide, alphaTest: 0.05
    });
    const eye = new THREE.Mesh(new THREE.PlaneGeometry(0.095, 0.095), eyeMat);
    eye.position.set(sx * 0.042, 0.028, 0.125);
    eye.rotation.y = sx * -0.35;
    eye.rotation.x = -0.08;
    eye.renderOrder = 10;
    g.add(eye);
    eyes.push(eye);
  }
  g.userData.eyes = eyes;
  g.userData.eyeCanvases = eyeCanvases;

  g.userData.blush = [];
  for (const sx of [-1, 1]) {
    const bl = new THREE.Mesh(
      new THREE.CircleGeometry(0.03, 16),
      new THREE.MeshBasicMaterial({
        color: 0xff7aa8, transparent: true, opacity: 0.35,
        depthTest: false, depthWrite: false, side: THREE.DoubleSide
      })
    );
    bl.position.set(sx * 0.06, -0.01, 0.12);
    bl.renderOrder = 9;
    g.add(bl);
    g.userData.blush.push(bl);
  }

  const mouthC = document.createElement("canvas");
  mouthC.width = 128; mouthC.height = 64;
  const mouthCtx = mouthC.getContext("2d");
  drawMouth(mouthCtx, 128, 64, "soft");
  const mouthTex = new THREE.CanvasTexture(mouthC);
  mouthTex.colorSpace = THREE.SRGBColorSpace;
  const mouth = new THREE.Mesh(
    new THREE.PlaneGeometry(0.045, 0.025),
    new THREE.MeshBasicMaterial({
      map: mouthTex, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide
    })
  );
  mouth.position.set(0, -0.04, 0.122);
  mouth.renderOrder = 10;
  g.add(mouth);
  g.userData.mouth = mouth;
  g.userData.mouthCanvas = { c: mouthC, ctx: mouthCtx, tex: mouthTex };

  g.userData.emotion = "neutral";
  g.userData.setEmotion = (name) => {
    const emo = EMOTIONS[name] || EMOTIONS.neutral;
    g.userData.emotion = name;
    eyeCanvases.forEach((ec, i) => {
      ec.ctx.clearRect(0, 0, 256, 256);
      drawAnimeEye(ec.ctx, 128, 128, ec.flip, emo);
      eyes[i].material.map.needsUpdate = true;
    });
    drawMouth(mouthCtx, 128, 64, emo.mouth || "soft");
    mouthTex.needsUpdate = true;
    g.userData.blush.forEach(b => { b.material.opacity = emo.blush ?? 0.35; });
  };
  g.userData.setEmotion("neutral");

  return g;
}

  return g;

/** Slender high-arch foot — petite profile like a ballet/pointe reference */
function makeFoot(mat, side = 1) {
  const g = new THREE.Group();
  const s = side;

  // Slim ankle → foot blend (continuous with calf)
  const ankleBlend = mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.04, 14), mat);
  ankleBlend.position.set(0, 0.04, -0.05);
  g.add(ankleBlend);
  const malleolus = mesh(new THREE.SphereGeometry(0.016, 14, 12), mat);
  malleolus.position.set(0.014 * s, 0.035, -0.048);
  malleolus.scale.set(0.7, 1.0, 0.85);
  g.add(malleolus);

  // Narrow heel (raised look — round, not chunky)
  const heel = mesh(new THREE.SphereGeometry(0.02, 16, 14), mat);
  heel.position.set(0, 0.012, -0.072);
  heel.scale.set(0.95, 1.05, 1.15);
  g.add(heel);
  const heelCap = mesh(new THREE.SphereGeometry(0.015, 12, 10), solePadMat, false);
  heelCap.position.set(0, -0.002, -0.075);
  heelCap.scale.set(1.0, 0.55, 1.0);
  g.add(heelCap);

  // HIGH ARCH — midfoot curves up off the ground (key of the reference)
  const archTop = mesh(new THREE.CapsuleGeometry(0.015, 0.055, 6, 12), mat);
  archTop.rotation.x = Math.PI / 2;
  archTop.position.set(0, 0.028, -0.01); // lifted
  archTop.scale.set(0.85, 1.0, 0.75);
  g.add(archTop);
  // underside hollow of arch (thin ribbon, not a flat slab)
  const archCurve = mesh(new THREE.TorusGeometry(0.038, 0.011, 10, 20, Math.PI * 0.9), mat);
  archCurve.rotation.z = Math.PI / 2;
  archCurve.rotation.y = Math.PI / 2;
  archCurve.position.set(0, 0.01, -0.005);
  archCurve.scale.set(0.55, 1.0, 0.9);
  g.add(archCurve);

  // Instep / top of foot — elegant slope heel→toes
  const instep = mesh(new THREE.CapsuleGeometry(0.014, 0.07, 6, 12), mat);
  instep.rotation.x = Math.PI / 2 + 0.22; // slopes down toward toes
  instep.position.set(0, 0.03, 0.02);
  instep.scale.set(0.9, 1.0, 0.7);
  g.add(instep);

  // Ball of foot — compact, not a wide pancake
  const ball = mesh(new THREE.SphereGeometry(0.022, 16, 14), mat);
  ball.position.set(0, 0.008, 0.078);
  ball.scale.set(1.15, 0.75, 1.0);
  g.add(ball);
  const ballPad = mesh(new THREE.SphereGeometry(0.018, 12, 10), solePadMat, false);
  ballPad.position.set(0, -0.006, 0.08);
  ballPad.scale.set(1.25, 0.4, 1.0);
  g.add(ballPad);

  // Thin sole contact only under heel + ball (NOT a flat full-length brick)
  // (arch stays open like the photo)

  // Petite toes — short, neat, slightly curled (tip-toe pressure)
  const toeDefs = [
    { x: 0.018 * s, len: 0.026, r: 0.0088, nailW: 0.011, nailL: 0.009 }, // hallux
    { x: 0.007 * s, len: 0.028, r: 0.0072, nailW: 0.008, nailL: 0.008 },
    { x:-0.002 * s, len: 0.027, r: 0.0068, nailW: 0.0075, nailL: 0.008 },
    { x:-0.010 * s, len: 0.024, r: 0.0062, nailW: 0.0065, nailL: 0.007 },
    { x:-0.017 * s, len: 0.020, r: 0.0055, nailW: 0.0055, nailL: 0.006 },
  ];

  toeDefs.forEach((t, i) => {
    const toeRoot = new THREE.Group();
    toeRoot.position.set(t.x, 0.004, 0.092);
    // tip-toe flex — toes press down
    toeRoot.rotation.x = 0.35 + i * 0.04;
    toeRoot.rotation.y = -t.x * 1.2;
    g.add(toeRoot);

    const phalanx = mesh(new THREE.CapsuleGeometry(t.r, t.len * 0.55, 5, 8), mat);
    phalanx.rotation.x = Math.PI / 2;
    phalanx.position.set(0, 0.002, t.len * 0.28);
    toeRoot.add(phalanx);

    const tip = mesh(new THREE.SphereGeometry(t.r * 1.05, 10, 8), mat);
    tip.position.set(0, 0.0, t.len * 0.58);
    toeRoot.add(tip);

    const pad = mesh(new THREE.SphereGeometry(t.r * 1.05, 8, 6), solePadMat, false);
    pad.position.set(0, -t.r * 0.7, t.len * 0.4);
    pad.scale.set(1.1, 0.4, 1.2);
    toeRoot.add(pad);

    const nail = mesh(new THREE.SphereGeometry(0.006, 10, 6), nailMat, false);
    nail.position.set(0, t.r * 0.75, t.len * 0.55);
    nail.scale.set(t.nailW / 0.012, 0.2, t.nailL / 0.012);
    nail.rotation.x = -0.4;
    toeRoot.add(nail);
  });

  g.userData.soleOffsetY = -0.01;

  // Socks + shoes (toggleable for story → barefoot)
  const footwear = new THREE.Group();
  footwear.name = "footwear";
  const sock = mesh(new THREE.SphereGeometry(0.045, 14, 10), sockMat);
  sock.position.set(0, 0.012, 0.02);
  sock.scale.set(1.05, 0.7, 1.55);
  footwear.add(sock);
  const sockCuff = mesh(new THREE.TorusGeometry(0.028, 0.008, 8, 16), sockMat);
  sockCuff.rotation.x = Math.PI / 2;
  sockCuff.position.set(0, 0.045, -0.04);
  footwear.add(sockCuff);
  const shoe = mesh(new THREE.SphereGeometry(0.048, 14, 10), shoeMat);
  shoe.position.set(0, 0.002, 0.03);
  shoe.scale.set(1.15, 0.55, 1.7);
  footwear.add(shoe);
  const shoeToe = mesh(new THREE.SphereGeometry(0.03, 12, 8), shoeMat);
  shoeToe.position.set(0, 0.0, 0.1);
  shoeToe.scale.set(1.2, 0.55, 1.0);
  footwear.add(shoeToe);
  footwear.visible = false; // freeplay starts barefoot
  g.add(footwear);
  g.userData.footwear = footwear;

  return g;
}

  outQuat.setFromRotationMatrix(new THREE.Matrix4().makeBasis(side, up, toes));
}

function orientToesOnDorsalQuat(sideSign, outQuat) {
  const toes = new THREE.Vector3(0, -1, 0);
  const up = new THREE.Vector3(sideSign * 0.35, 0.85, 0).normalize();
  const side = new THREE.Vector3().crossVectors(toes, up).normalize();
  up.copy(new THREE.Vector3().crossVectors(side, toes).normalize());
  outQuat.setFromRotationMatrix(new THREE.Matrix4().makeBasis(side, up, toes));
}

/**
 * Feet stay CHILDREN of ankles. Pole-vector IK bends the knee UP/OUT
 * (natural seated pose) — not down into the floor.
 */
function poseLegAndFoot(leg, foot, target, sign) {
  const hip = leg.hip, knee = leg.knee, ankle = leg.ankle;
  const thighLen = leg.thighLen, calfLen = leg.calfLen;
  const hipsParent = hip.parent;

  strokeRig.updateWorldMatrix(true, true);
  target.updateWorldMatrix(true, false);
  const desiredPos = new THREE.Vector3();
  const desiredQuat = new THREE.Quaternion();
  target.matrixWorld.decompose(desiredPos, desiredQuat, _scale);

  hipsParent.updateWorldMatrix(true, false);
  hip.getWorldPosition(_hipW);

  _dir.subVectors(desiredPos, _hipW);
  let dist = _dir.length();
  const maxReach = thighLen + calfLen - 0.012;
  const minReach = Math.abs(thighLen - calfLen) + 0.04;
  let stretch = 1;
  if (dist > maxReach) { stretch = dist / maxReach; dist = maxReach; }
  dist = THREE.MathUtils.clamp(dist, minReach, maxReach);
  const tLen = thighLen * stretch;
  const cLen = calfLen * stretch;

  // Pole: above + slightly outward so the knee folds UP, not into the bed
  const pole = new THREE.Vector3(
    _hipW.x + sign * 0.45,
    Math.max(_hipW.y, desiredPos.y) + 0.65,
    (_hipW.z + desiredPos.z) * 0.5
  );

  const axis = _dir.clone().normalize(); // hip → ankle
  // Project pole into the bend plane and force it upward
  const hipToPole = pole.clone().sub(_hipW);
  let bend = new THREE.Vector3().crossVectors(axis, hipToPole).cross(axis);
  if (bend.lengthSq() < 1e-8) {
    // fallback: world up projected off axis
    bend.crossVectors(axis, new THREE.Vector3(0, 1, 0)).cross(axis);
  }
  bend.normalize();
  // If bend aims downward, flip — we always want the knee higher than the hip–ankle line
  const mid = _hipW.clone().add(desiredPos).multiplyScalar(0.5);
  const probe = mid.clone().addScaledVector(bend, 0.2);
  if (probe.y < mid.y) bend.negate();

  const a = (tLen * tLen - cLen * cLen + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0.0001, tLen * tLen - a * a));
  const kneeWorld = _hipW.clone().addScaledVector(axis, a).addScaledVector(bend, h);

  // Orient hip so local -Y points at knee
  const thighDirWorld = kneeWorld.clone().sub(_hipW).normalize();
  const parentQ = new THREE.Quaternion();
  hipsParent.getWorldQuaternion(parentQ);
  const thighDirLocal = thighDirWorld.clone().applyQuaternion(parentQ.clone().invert());
  hip.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), thighDirLocal);

  // Orient knee so local -Y points at ankle target
  // First place knee joint at correct bone length along thigh
  leg.thigh.quaternion.identity();
  leg.thigh.position.set(0, -tLen * 0.5, 0);
  leg.thigh.scale.set(1, stretch, 1);
  knee.position.set(0, -tLen, 0);
  knee.quaternion.identity();

  hip.updateWorldMatrix(true, true);
  const kneePosNow = new THREE.Vector3();
  knee.getWorldPosition(kneePosNow);
  const calfDirWorld = desiredPos.clone().sub(kneePosNow).normalize();
  const kneeWorldQ = new THREE.Quaternion();
  knee.getWorldQuaternion(kneeWorldQ);
  const calfDirLocal = calfDirWorld.clone().applyQuaternion(kneeWorldQ.clone().invert());
  knee.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), calfDirLocal);

  leg.calf.quaternion.identity();
  leg.calf.position.set(0, -cLen * 0.5, 0);
  leg.calf.scale.set(1, stretch, 1);
  ankle.position.set(0, -cLen, 0);
  ankle.quaternion.identity();

  // Snap ankle onto exact target; stretch calf mesh to bridge knee → ankle
  hip.updateWorldMatrix(true, true);
  const ankleLocal = desiredPos.clone();
  knee.worldToLocal(ankleLocal);
  ankle.position.copy(ankleLocal);
  const reach = Math.max(0.04, ankle.position.length());
  const along = ankle.position.clone().normalize();
  leg.calf.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), along);
  leg.calf.scale.set(1, reach / calfLen, 1);
  leg.calf.position.copy(ankle.position).multiplyScalar(0.5);

  // Foot local pose matches shaft target exactly (still parented to ankle)
  hip.updateWorldMatrix(true, true);
  const ankleWorldQuat = new THREE.Quaternion();
  ankle.getWorldQuaternion(ankleWorldQuat);
  foot.position.set(0, 0, 0);
  foot.scale.setScalar(1.0);
  foot.quaternion.copy(ankleWorldQuat).invert().multiply(desiredQuat);
  ankle.visible = true;
}

function placeFeet(dt) {
  const r = boy.userData.SHAFT_R;
  const grip = stim.grip;
  const toeMilk = stim.technique === "toeMilk";

  if (toeMilk) {
    const milk = stim.pos;
    const z = THREE.MathUtils.lerp(0.04, 0.195, milk);
    const stagger = 0.035 * Math.sin(stim.milkPhase * 0.7);
    const zL = THREE.MathUtils.clamp(z + stagger, 0.035, 0.2);
    const zR = THREE.MathUtils.clamp(z - stagger * 0.85, 0.035, 0.2);
    const squeezePulse = 0.5 + 0.5 * Math.sin(stim.milkPhase * 1.15);
    const press = r * (0.55 + grip * 0.25 + squeezePulse * 0.2);
    const dorsalY = r * 0.15 + press;
    const spread = 0.012 + (1 - squeezePulse) * 0.018;

    targetL.position.set(-spread - squeezePulse * 0.004, dorsalY, zL);
    targetR.position.set(spread + squeezePulse * 0.004, dorsalY, zR);
    orientToesOnDorsalQuat(-1, _quat);
    targetL.quaternion.copy(_quat);
    targetL.rotateX(-(0.12 + squeezePulse * 0.18));
    targetL.rotateZ(-0.08 - stim.footAngle * 0.15);
    orientToesOnDorsalQuat(1, _quat);
    targetR.quaternion.copy(_quat);
    targetR.rotateX(-(0.12 + squeezePulse * 0.18));
    targetR.rotateZ(0.08 + stim.footAngle * 0.15);

    const ySquash = 1 - (0.06 + grip * 0.08 + squeezePulse * 0.05);
    boy.userData.shaft.scale.set(1 + (1 - ySquash) * 0.5, ySquash, 1 + Math.abs(stim.vel) * 0.02);

    poseLegAndFoot(girl.userData.legs.L, footL, targetL, -1);
    poseLegAndFoot(girl.userData.legs.R, footR, targetR, 1);
  } else {
    const padReach = 0.018 * 1.0;
    const dig = 0.022 + grip * 0.028 + (stim.overstim ? 0.012 : 0);
    const sep = Math.max(0.01, padReach - dig);
    const stroke = stim.pos;
    const z = THREE.MathUtils.lerp(0.03, 0.2, stroke);
    const zR = THREE.MathUtils.lerp(0.03, 0.2, THREE.MathUtils.clamp(stroke - (stim.bothFeet ? 0.08 : 0), 0, 1));
    const squeeze = Math.min(0.2, Math.abs(stim.vel) * 0.05 + stim.twitch * 0.02);
    const sepL = Math.max(0.008, sep - squeeze);
    const sepR = stim.bothFeet ? Math.max(0.008, sep - squeeze) : 0.14;

    targetL.position.set(-sepL, 0, z + 0.004 * Math.sin(stim.phase * 2));
    orientSoleInwardQuat(+1, _quat);
    targetL.quaternion.copy(_quat);
    targetL.rotateZ(THREE.MathUtils.clamp(stim.footAngle * 0.25, -0.2, 0.2));
    targetL.rotateX(THREE.MathUtils.clamp(stim.vel * 0.08 + stim.twitch * 0.15, -0.35, 0.35));

    if (stim.bothFeet) {
      targetR.position.set(sepR, 0, zR - 0.004 * Math.sin(stim.phase * 2));
      orientSoleInwardQuat(-1, _quat);
      targetR.quaternion.copy(_quat);
      targetR.rotateZ(THREE.MathUtils.clamp(-stim.footAngle * 0.25, -0.2, 0.2));
      targetR.rotateX(THREE.MathUtils.clamp(-stim.vel * 0.08 - stim.twitch * 0.15, -0.35, 0.35));
    } else {
      targetR.position.set(0.14, -0.03, 0);
      targetR.rotation.set(0.5, 0.4, -0.5);
    }

    if (stim.overstim) {
      const curl = Math.sin(stim.phase * 4) * 0.006;
      targetL.position.x -= curl;
      if (stim.bothFeet) targetR.position.x += curl;
    }

    const squash = 1 - (0.08 + grip * 0.16 + (stim.overstim ? 0.04 : 0)) * (stim.bothFeet ? 1 : 0.55);
    boy.userData.shaft.scale.set(squash, squash, 1 + Math.abs(stim.vel) * 0.03);

    poseLegAndFoot(girl.userData.legs.L, footL, targetL, -1);
    if (stim.bothFeet) poseLegAndFoot(girl.userData.legs.R, footR, targetR, 1);
    else {
      const leg = girl.userData.legs.R;
      leg.thigh.scale.set(1, 1, 1); leg.calf.scale.set(1, 1, 1);
      leg.thigh.quaternion.identity(); leg.calf.quaternion.identity();
      leg.thigh.position.set(0, -leg.thighLen * 0.5, 0);
      leg.knee.position.set(0, -leg.thighLen, 0);
      leg.calf.position.set(0, -leg.calfLen * 0.5, 0);
      leg.ankle.position.set(0, -leg.calfLen, 0);
      leg.hip.rotation.set(-0.55, 0.45, 0.55);
      leg.knee.rotation.set(1.25, 0, 0);
      footR.position.set(0, 0, 0);
      footR.rotation.set(-Math.PI / 2, 0, 0);
      footR.scale.setScalar(1.0);
    }
  }

  const react = stim.arousal * 0.08 + stim.twitch * 0.12;
  if (!(story.active && story.poseLock)) {
    girl.userData.torso.rotation.x = 0.32 + Math.sin(stim.phase) * 0.05 + react;
    girl.userData.head.rotation.y = story.headYaw + Math.sin(performance.now() * 0.0012) * 0.08;
    girl.userData.head.rotation.x = -0.05 + stim.arousal * 0.12 + (toeMilk ? 0.08 : 0);
    girl.userData.head.rotation.z = Math.sin(stim.phase * 1.5) * 0.04 * stim.arousal;
  }
  // Don't override story emotion blush unless freeplay / play phase
  if (!story.active || story.phase === "play" || story.phase === "clothed_rub") {
    const base = EMOTIONS[girl.userData.head.userData.emotion]?.blush ?? 0.35;
    const blushOp = Math.max(base, 0.35 + stim.arousal * 0.5 + (toeMilk ? 0.15 : 0));
    girl.userData.head.userData.blush?.forEach(b => { b.material.opacity = blushOp; });
  }
  if (girl.userData.head.userData.mouth) {
    const m = girl.userData.head.userData.mouth;
    m.scale.set(1 + stim.arousal * 0.15, 1 + stim.twitch * 0.25, 1);
  }
  girl.userData.hair.rotation.z = Math.sin(performance.now() * 0.002) * 0.04;

  const swell = 1 + stim.arousal * 0.14 + (stim.climax ? 0.08 : 0) + stim.sensitivity * 0.015;
  boy.userData.headG.scale.set(1.05 * swell, 0.95 * swell, 1.1 * swell);
  const hipTwitch = Math.sin(stim.phase * 2) * 0.01 * stim.arousal + stim.twitch * Math.sin(performance.now() * 0.035) * 0.015;
  boy.userData.hips.rotation.x = -Math.PI / 2 + 0.05 + hipTwitch;
  blushLight.intensity = 0.35 + stim.arousal * 0.55 + (toeMilk ? 0.35 : 0);
}

function updateSolver(dt) {
  stim.speed = +ui.speed.value;
  stim.grip = +ui.grip.value;
  stim.twitch = Math.max(0, stim.twitch - dt * 0.4);
  stim.shake = Math.max(0, stim.shake - dt * 1.2);

  const toeMilk = stim.technique === "toeMilk";
  const mustContinue = stim.auto && !stim.manualDrive; // climax never blocks

  if (mustContinue) {
    if (toeMilk) {
      // Distinct from normal stroke: slow comfortable dorsal milking curve
      // Use a raised-cosine + secondary harmonic so it doesn't feel like the same loop
      stim.milkPhase += dt * (0.55 + stim.speed * 0.45) * (stim.overstim ? 1.05 : 0.85);
      const a = stim.milkPhase;
      // slow glide base
      const glide = 0.5 + 0.42 * Math.sin(a);
      // soft "squeeze pause" near the tip — linger comfortably
      const linger = 0.08 * Math.sin(a * 0.5 + 1.2);
      // tiny irregularity so it never looks robotic-repeated
      const human = 0.03 * Math.sin(a * 2.3 + 0.4) + 0.02 * Math.sin(a * 0.37);
      stim.target = THREE.MathUtils.clamp(glide + linger + human, 0.08, 0.94);
    } else {
      stim.phase += dt * stim.speed * 2.6 * (stim.overstim ? 1.2 : 1);
      const s = Math.sin(stim.phase);
      const amp = stim.overstim ? 0.42 : 0.38;
      const shaped = Math.sign(s) * Math.pow(Math.abs(s), stim.overstim ? 0.55 : 0.75);
      stim.target = 0.5 + shaped * amp;
    }
  }

  // Extra-soft spring for toe milk = buttery comfortable feel
  const k = toeMilk ? 18 : (stim.overstim ? 52 : 48);
  const c = 2 * Math.sqrt(k) * (toeMilk ? 1.15 : 0.9);
  const acc = (stim.target - stim.pos) * k - stim.vel * c;
  stim.vel += acc * dt;
  const prev = stim.pos;
  stim.pos = THREE.MathUtils.clamp(stim.pos + stim.vel * dt, 0.05, 0.95);

  stim.contactForce = stim.grip * (10 + Math.abs(stim.vel) * (toeMilk ? 28 : 40)) * (toeMilk ? 1.1 : 1);

  if (prev < 0.5 && stim.pos >= 0.5) {
    const now = performance.now() / 1000;
    if (stim.lastZero > 0) stim.cadence = 1 / Math.max(0.05, now - stim.lastZero);
    stim.lastZero = now;
  }

  const work = stim.contactForce * Math.abs(stim.vel) * dt * 0.0045 * stim.sensitivity;
  const sweet = toeMilk
    ? 1.1 - Math.abs(stim.pos - 0.65) * 0.35  // tip-biased for toe milk
    : 1 - Math.abs(stim.pos - 0.55) * 0.4;

  // Always build while moving — climax never freezes progress
  const floor = stim.neverStop ? (0.75 + Math.min(0.12, (stim.climaxCount - 1) * 0.02)) : 0;
  if (stim.climax && stim.neverStop) {
    stim.arousal = THREE.MathUtils.clamp(
      Math.max(floor, stim.arousal * (1 - dt * 0.12) + work * sweet * 1.9),
      floor, 1
    );
    if (stim.climaxT > 0.5 && stim.arousal >= 0.97) triggerClimax();
  } else if (!stim.climax) {
    const bonus = stim.overstim ? 1.45 : 1;
    stim.arousal = THREE.MathUtils.clamp(stim.arousal + work * sweet * bonus, 0, 1);
    if (!stim.auto && !stim.manualDrive && Math.abs(stim.vel) < 0.05 && !stim.neverStop) {
      stim.arousal = Math.max(0, stim.arousal - dt * 0.03);
    }
    if (stim.arousal >= 0.995) triggerClimax();
  } else {
    // non-neverStop climax (shouldn't happen often) — still keep a short drip then recover
    stim.arousal = Math.max(0.2, stim.arousal - dt * 0.05);
  }

  if (stim.climax) {
    stim.climaxT += dt;
    const dripChance = toeMilk ? 0.35 : 0.4;
    if (stim.climaxT < 4.0 && Math.random() < dripChance) {
      const tip = new THREE.Vector3();
      boy.userData.shaftTip.getWorldPosition(tip);
      spawnDrop(tip, new THREE.Vector3((Math.random() - 0.5) * 0.18, 0.2 + Math.random() * 0.45, 0.1 + Math.random() * 0.25));
    }
    // Clear climax flag so next wave can fire, but NEVER stop technique / auto
    if (stim.neverStop && stim.climaxT > 1.0 && stim.arousal < 0.96) {
      stim.climax = false;
      stim.twitch = Math.max(stim.twitch, 0.35);
      ui.hint.textContent = `Toes on the back · milking · ${stim.sensitivity.toFixed(1)}× · no stop`;
    } else if (!stim.neverStop && stim.climaxT > 2.5) {
      // legacy path — still force neverStop behavior now
      stim.neverStop = true;
      stim.technique = "toeMilk";
      stim.climax = false;
      stim.arousal = Math.max(stim.arousal, 0.8);
    }
    if (toeMilk && Math.random() < 0.04) spawnHeart();
  }

  if ((stim.overstim || stim.neverStop) && (stim.auto || stim.manualDrive) && Math.abs(stim.vel) > 0.02) {
    stim.sensitivity = Math.min(5, stim.sensitivity + dt * 0.1);
    if (Math.random() < 0.02) spawnHeart();
  }

  for (let i = stim.droplets.length - 1; i >= 0; i--) {
    const d = stim.droplets[i];
    d.v.y -= 3.2 * dt;
    d.mesh.position.addScaledVector(d.v, dt);
    d.life -= dt;
    d.mesh.material.opacity = Math.max(0, d.life);
    if (d.mesh.position.y < 0.02) {
      d.mesh.position.y = 0.02; d.v.y *= -0.2; d.v.x *= 0.7; d.v.z *= 0.7;
    }
    if (d.life <= 0) { scene.remove(d.mesh); stim.droplets.splice(i, 1); }
  }

  if (!(story.active && story.poseLock)) placeFeet(dt);
  updateStory(dt);

  const p = Math.round(stim.arousal * 100);
  ui.bar.style.width = p + "%";
  ui.pct.textContent = p + "%";
  const sPct = Math.round((stim.sensitivity / 5) * 100);
  ui.senseBar.style.width = sPct + "%";
  ui.sensePct.textContent = Math.round(stim.sensitivity * 100) + "%";
  ui.tPos.textContent = stim.pos.toFixed(2);
  ui.tVel.textContent = (stim.vel * 0.15).toFixed(2) + " m/s";
  ui.tForce.textContent = stim.contactForce.toFixed(1) + " N";
  ui.tCad.textContent = stim.cadence.toFixed(2) + " Hz";
  ui.tSense.textContent = stim.sensitivity.toFixed(1) + "×";
  ui.tClimax.textContent = String(stim.climaxCount);

  if (toeMilk) {
    ui.hint.textContent = stim.climax
      ? `Toe-squeeze climax #${stim.climaxCount} — dorsal milk, no stop`
      : `Toe milk on the back · slow up·down squeeze · ${stim.sensitivity.toFixed(1)}×`;
    ui.hint.classList.add("hot");
  } else if (stim.arousal > 0.8) {
    ui.hint.textContent = stim.overstim ? "Edge… then toes take over" : "Almost — keep going";
    ui.hint.classList.add("hot");
  }
}

let orbitT = 0;
function updateCamera(dt) {
  if (stim.shake > 0.05) {
    const soft = stim.overstim ? 0.012 : 0.03;
    camera.position.x += (Math.random() - 0.5) * soft * stim.shake;
    camera.position.y += (Math.random() - 0.5) * soft * 0.7 * stim.shake;
  }
  const amt = +ui.orbit.value;
  if (amt <= 0.001 || stim.manualDrive) return;
  orbitT += dt * 0.15 * amt;
  const r = camera.position.distanceTo(controls.target);
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, Math.cos(orbitT) * r * 0.45 + 1.1, dt * 0.3 * amt);
  camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.sin(orbitT) * r * 0.35 - 0.2, dt * 0.3 * amt);
}

const PLAY_LINES = [

function applyBeat(i) {
  const b = STORY_BEATS[i];
  if (!b) return;
  story.idx = i;
  setEmotion(b.emotion);
  showDialogue(b.who, b.line);
  b.enter?.();
}

function storyNext() {
  if (!story.active) return;
  // during clothed_rub, block advance until arousal high enough (unless last lines of undress)
  if (story.phase === "clothed_rub" && story.idx === 9 && stim.arousal < 0.72) {
    showDialogue("Girl", "Not yet… keep rubbing. Almost max~");
    setEmotion("tease");
    return;
  }
  if (story.idx >= STORY_BEATS.length - 1) {
    // stay in play with rotating lines
    story.phase = "play";
    const line = PLAY_LINES[story.talkIdx % PLAY_LINES.length];
    story.talkIdx++;
    setEmotion(line.e);
    showDialogue("Girl", line.t);
    return;
  }
  applyBeat(story.idx + 1);
}

function startStory() {
  story.active = true;
  story.idx = 0;
  story.phase = "cutscene";
  story.poseLock = true;
  story.talkIdx = 0;
  stim.arousal = 0; stim.climax = false; stim.climaxCount = 0;
  stim.neverStop = false; stim.technique = "stroke"; stim.sensitivity = 1;
  stim.auto = false;
  storyBtn.classList.add("active");
  document.body.classList.add("story-playing");
  ui.controls.classList.remove("story-live");
  applyBeat(0);
}

  story.active = false;

  stim.auto = true;
}

storyBtn.onclick = (e) => {

  if (story.active) {

    ui.hint.textContent = "Story ended — freeplay";
  } else {

dlgEl.onclick = (e) => { e.stopPropagation(); storyNext(); };

});

function updateStory(dt) {
  if (!story.active) return;
  if (story.poseLock) {
    girl.userData.head.rotation.y = THREE.MathUtils.lerp(
      girl.userData.head.rotation.y, story.headYaw, Math.min(1, dt * 3)

  if (story.phase === "clothed_rub") {

    }

}

document.getElementById("load").classList.add("hide");

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.033, clock.getDelta());
  updateSolver(dt);
  updateCamera(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
